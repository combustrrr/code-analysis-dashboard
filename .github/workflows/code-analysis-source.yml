name: Code analysis source
run-name: Source analysis ${{ inputs.dispatch_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true
      dispatch_id:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: source-revision-global
  cancel-in-progress: false
jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.tooling_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify dispatch against its durable accepted request
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_JSON: ${{ inputs.target }}
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
          IS_REUSABLE_ANALYSIS: 'true'
        run: python -m scripts.code_analysis.source_identity --validate-only
  analyze:
    if: ${{ always() && needs['validate-request'].result == 'success' && fromJSON(inputs.target).profile_mode == 'portable' }}
    needs: [validate-request, isolated-vendor]
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source.yml@7e880ec0cef4aed4501f843a6d196d7068c5ab8f
    with:
      tooling_sha: ${{ inputs.tooling_sha }}
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
  configured-profile:
    if: ${{ always() && needs['validate-request'].result == 'success' && fromJSON(inputs.target).profile_mode == 'agentic-soc' }}
    needs: [validate-request, isolated-vendor]
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source-full.yml@7e880ec0cef4aed4501f843a6d196d7068c5ab8f
    with:
      tooling_sha: ${{ inputs.tooling_sha }}
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
  isolated-vendor:
    needs: validate-request
    permissions:
      contents: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-vendor.yml@7e880ec0cef4aed4501f843a6d196d7068c5ab8f
    with:
      tooling_sha: ${{ inputs.tooling_sha }}
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
      CODERABBIT_GITHUB_TOKEN: ${{ secrets.CODERABBIT_GITHUB_TOKEN }}
