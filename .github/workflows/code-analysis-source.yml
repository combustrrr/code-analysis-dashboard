name: Code analysis source
run-name: Source analysis ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ fromJSON(inputs.target).profile_mode == 'portable' }}
    needs: isolated-vendor
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source.yml@0ff77f8530c0f7c60b78f10c14d1ebe8216f2daf
    with:
      tooling_sha: 0ff77f8530c0f7c60b78f10c14d1ebe8216f2daf
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
  configured-profile:
    if: ${{ fromJSON(inputs.target).profile_mode == 'agentic-soc' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source-full.yml@0ff77f8530c0f7c60b78f10c14d1ebe8216f2daf
    with:
      tooling_sha: 0ff77f8530c0f7c60b78f10c14d1ebe8216f2daf
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
  isolated-vendor:
    if: ${{ fromJSON(inputs.target).profile_mode == 'portable' }}
    permissions:
      contents: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-vendor.yml@0ff77f8530c0f7c60b78f10c14d1ebe8216f2daf
    with:
      tooling_sha: 0ff77f8530c0f7c60b78f10c14d1ebe8216f2daf
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
      CODERABBIT_GITHUB_TOKEN: ${{ secrets.CODERABBIT_GITHUB_TOKEN }}
