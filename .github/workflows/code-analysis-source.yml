name: Code analysis source
run-name: Source analysis ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ fromJSON(inputs.target).profile_mode == 'portable' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source.yml@d6dcac5421e7cf5f39cb29a51c41d3f4c54ec13b
    with:
      tooling_sha: d6dcac5421e7cf5f39cb29a51c41d3f4c54ec13b
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
  configured-profile:
    if: ${{ fromJSON(inputs.target).profile_mode == 'agentic-soc' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source-full.yml@d6dcac5421e7cf5f39cb29a51c41d3f4c54ec13b
    with:
      tooling_sha: d6dcac5421e7cf5f39cb29a51c41d3f4c54ec13b
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
