name: Code analysis source
run-name: Source analysis ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ fromJSON(inputs.target).profile_mode == 'portable' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source.yml@00d634ef8bdbaca0b8e7e92ad68ce51a9d5680cd
    with:
      tooling_sha: 00d634ef8bdbaca0b8e7e92ad68ce51a9d5680cd
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
  configured-profile:
    if: ${{ fromJSON(inputs.target).profile_mode == 'agentic-soc' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source-full.yml@00d634ef8bdbaca0b8e7e92ad68ce51a9d5680cd
    with:
      tooling_sha: 00d634ef8bdbaca0b8e7e92ad68ce51a9d5680cd
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
