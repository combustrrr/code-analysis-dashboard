name: Code analysis source
run-name: Source analysis ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ fromJSON(inputs.target).profile_mode == 'portable' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source.yml@bc5bce7f8dca81d4512a81279f1511d64e2a291f
    with:
      tooling_sha: bc5bce7f8dca81d4512a81279f1511d64e2a291f
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
  configured-profile:
    if: ${{ fromJSON(inputs.target).profile_mode == 'agentic-soc' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source-full.yml@bc5bce7f8dca81d4512a81279f1511d64e2a291f
    with:
      tooling_sha: bc5bce7f8dca81d4512a81279f1511d64e2a291f
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
