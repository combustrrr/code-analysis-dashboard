name: Code analysis source
run-name: Source analysis ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ fromJSON(inputs.target).profile_mode == 'portable' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source.yml@9a0d31be6ed91348a651e30e4c155f1e7776e3e5
    with:
      tooling_sha: 9a0d31be6ed91348a651e30e4c155f1e7776e3e5
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
  configured-profile:
    if: ${{ fromJSON(inputs.target).profile_mode == 'agentic-soc' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source-full.yml@9a0d31be6ed91348a651e30e4c155f1e7776e3e5
    with:
      tooling_sha: 9a0d31be6ed91348a651e30e4c155f1e7776e3e5
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
    secrets: inherit
