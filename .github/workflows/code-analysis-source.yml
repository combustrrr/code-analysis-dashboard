name: Code analysis source
run-name: Source analysis ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      target:
        type: string
        required: true
      tooling_sha:
        type: string
        required: true
      request_id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  analyze:
    if: ${{ fromJSON(inputs.target).profile_mode == 'portable' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source.yml@fd0e887cc39b0fcd4d4c029164d6fa9aa7c704a0
    with:
      tooling_sha: fd0e887cc39b0fcd4d4c029164d6fa9aa7c704a0
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
  configured-profile:
    if: ${{ fromJSON(inputs.target).profile_mode == 'agentic-soc' }}
    permissions:
      contents: read
      actions: read
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-source-full.yml@fd0e887cc39b0fcd4d4c029164d6fa9aa7c704a0
    with:
      tooling_sha: fd0e887cc39b0fcd4d4c029164d6fa9aa7c704a0
      target: ${{ inputs.target }}
      request_id: ${{ inputs.request_id }}
