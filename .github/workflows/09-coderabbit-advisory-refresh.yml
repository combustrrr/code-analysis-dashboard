name: CodeRabbit Advisory Evidence
true:
  pull_request_review:
    types:
    - submitted
  issue_comment:
    types:
    - created
permissions:
  contents: read
  pull-requests: read
jobs:
  collect:
    name: Retain exact-head AI advisory evidence
    if: "(github.actor == 'coderabbitai[bot]' || github.actor == 'coderabbitai') && ((github.event_name == 'pull_request_review'\
      \ &&\n  github.event.pull_request.head.repo.full_name == github.repository) ||\n (github.event_name == 'issue_comment'\
      \ && github.event.issue.pull_request &&\n  contains(github.event.comment.body, 'Review finished')))"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: coderabbit-evidence-${{ github.event.pull_request.head.sha || github.event.issue.number }}
      cancel-in-progress: false
    steps:
    - name: Checkout trusted evidence collector
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        sparse-checkout: scripts/code_analysis/collect_coderabbit.py
        sparse-checkout-cone-mode: false
    - name: Resolve exact pull-request head
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      shell: bash
      run: "set -euo pipefail\npr=\"$(gh api \"repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER\")\"\nhead_repo=\"$(jq -r '.head.repo.full_name'\
        \ <<< \"$pr\")\"\n[[ \"$head_repo\" == \"$GITHUB_REPOSITORY\" ]] || {\n  echo \"External-fork PR evidence is not collected\"\
        \ >&2\n  exit 1\n}\njq -r '\"branch=\\(.head.ref)\\ncommit=\\(.head.sha)\\npr_number=\\(.number)\"' <<< \"$pr\" >>\
        \ \"$GITHUB_OUTPUT\"\n"
    - name: Collect exact-head CodeRabbit evidence
      env:
        GH_TOKEN: ${{ github.token }}
        SCAN_BRANCH: ${{ steps.identity.outputs.branch }}
        SCAN_SHA: ${{ steps.identity.outputs.commit }}
      shell: bash
      run: "set -euo pipefail\npython scripts/code_analysis/collect_coderabbit.py \\\n  --repository \"$GITHUB_REPOSITORY\"\
        \ \\\n  --branch \"$SCAN_BRANCH\" \\\n  --commit \"$SCAN_SHA\" \\\n  --output-dir coderabbit-evidence\n"
    - name: Upload coderabbit-advisory-evidence-${{ steps.identity.outputs.commit }} to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp coderabbit-evidence/ s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/coderabbit-advisory-evidence-${{
        steps.identity.outputs.commit }} --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    - name: Publish evidence summary
      env:
        PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        PR_HEAD_BRANCH: ${{ steps.identity.outputs.branch }}
        PR_HEAD_SHA: ${{ steps.identity.outputs.commit }}
      shell: bash
      run: "set -euo pipefail\n{\n  echo \"## CodeRabbit AI advisory evidence retained\"\n  echo\n  printf '%s\\n' \"- PR:\
        \ #${PR_NUMBER}\"\n  printf '%s\\n' \"- Branch: \\`${PR_HEAD_BRANCH}\\`\"\n  printf '%s\\n' \"- Exact head: \\`${PR_HEAD_SHA}\\\
        `\"\n  echo \"- Evidence lane: \\`AI_ADVISORY\\`\"\n  echo \"- Issue Wall publication: \\`manual only\\`\"\n} >> \"\
        $GITHUB_STEP_SUMMARY\"\n"
