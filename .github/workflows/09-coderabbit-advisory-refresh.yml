name: CodeRabbit Advisory Evidence
'on':
  check_run:
    types:
    - completed
permissions:
  contents: read
  pull-requests: read
jobs:
  collect:
    name: Retain exact-head AI advisory evidence
    if: github.event.check_run.app.id == 347564 && github.event.check_run.name == 'CodeRabbit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: coderabbit-evidence-${{ github.event.check_run.head_sha }}
      cancel-in-progress: false
    steps:
    - name: Checkout trusted evidence collector
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: 177e333d2bb696424cdde3b1792fc1e08be10be9
        sparse-checkout: scripts/code_analysis/collect_coderabbit.py
        sparse-checkout-cone-mode: false
    - name: Resolve exact pull-request head
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
        CHECK_HEAD_SHA: ${{ github.event.check_run.head_sha }}
      shell: bash
      run: "set -euo pipefail\nprs=\"$(gh api -H 'Accept: application/vnd.github+json' \"repos/$GITHUB_REPOSITORY/commits/$CHECK_HEAD_SHA/pulls?per_page=100\")\"\npr=\"$(jq -cer --arg repo \"$GITHUB_REPOSITORY\" --arg sha \"$CHECK_HEAD_SHA\" '[.[] | select(.state == \"open\" and .head.sha == $sha and .head.repo.full_name == $repo)] | if length == 1 then .[0] else error(\"CodeRabbit check must map to exactly one open same-repository pull request\") end' <<< \"$prs\")\"\njq -r '\"branch=\\(.head.ref)\\ncommit=\\(.head.sha)\\npr_number=\\(.number)\"' <<< \"$pr\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Collect exact-head CodeRabbit evidence
      env:
        CODERABBIT_GITHUB_TOKEN: ${{ secrets.CODERABBIT_GITHUB_TOKEN }}
        COLLECTOR_SHA: 177e333d2bb696424cdde3b1792fc1e08be10be9
        SCAN_BRANCH: ${{ steps.identity.outputs.branch }}
        SCAN_SHA: ${{ steps.identity.outputs.commit }}
        PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
      shell: bash
      run: "set -euo pipefail\npython scripts/code_analysis/collect_coderabbit.py \\\n  --repository \"$GITHUB_REPOSITORY\"\
        \ \\\n  --branch \"$SCAN_BRANCH\" \\\n  --commit \"$SCAN_SHA\" \\\n  --output-dir coderabbit-evidence\n"
    - name: Upload coderabbit-advisory-evidence-${{ steps.identity.outputs.commit }} to R2
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
        R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        EVIDENCE_SHA: ${{ steps.identity.outputs.commit }}
      shell: bash
      run: >-
        aws s3 cp coderabbit-evidence/
        "s3://${R2_BUCKET_NAME}/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/coderabbit-advisory-evidence-${EVIDENCE_SHA}"
        --recursive
        --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
    - name: Publish evidence summary
      env:
        PR_NUMBER: ${{ steps.identity.outputs.pr_number }}
        PR_HEAD_BRANCH: ${{ steps.identity.outputs.branch }}
        PR_HEAD_SHA: ${{ steps.identity.outputs.commit }}
      shell: bash
      run: "set -euo pipefail\n{\n  echo \"## CodeRabbit AI advisory evidence retained\"\n  echo\n  printf '%s\\n' \"- PR:\
        \ #${PR_NUMBER}\"\n  printf '%s\\n' \"- Branch: \\`${PR_HEAD_BRANCH}\\`\"\n  printf '%s\\n' \"- Exact head: \\`${PR_HEAD_SHA}\\\
        `\"\n  echo \"- Evidence lane: \\`AI_ADVISORY\\`\"\n  echo \"- Issue Wall publication: \\`manual only\\`\"\n} >> \"\
        $GITHUB_STEP_SUMMARY\"\n"
