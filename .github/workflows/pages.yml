name: Deploy code analysis application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['analysis-ui/**', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: current-dashboard-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify authenticated application contracts
        run: node --test analysis-launcher/worker.test.mjs analysis-launcher/application.test.mjs analysis-launcher/github-app.test.mjs analysis-launcher/reports.test.mjs
      - name: Build application without report assets
        working-directory: analysis-ui
        env:
          VITE_APPLICATION_MODE: repositories
          VITE_LAUNCH_ENDPOINT: https://code-analysis-launcher.icsarthak9.workers.dev
          VITE_DEFAULT_EXECUTION_REPOSITORY: combustrrr/code-analysis-dashboard
          VITE_DEFAULT_PROJECT_ID: '1267340546'
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Retain publication metrics
        if: always()
        run: |
          python -c 'import pathlib; p=pathlib.Path("analysis-ui/dist"); print("Site bytes:",sum(f.stat().st_size for f in p.rglob("*") if f.is_file()))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: analysis-ui/dist
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
