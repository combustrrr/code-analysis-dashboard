name: Deploy code analysis application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['analysis-ui/**', '.github/workflows/pages.yml']
permissions:
  contents: read
concurrency:
  group: current-dashboard-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify authenticated application contracts
        run: node --test analysis-launcher/worker.test.mjs analysis-launcher/application.test.mjs analysis-launcher/github-app.test.mjs analysis-launcher/reports.test.mjs
      - name: Build application without report assets
        working-directory: analysis-ui
        env:
          VITE_APPLICATION_MODE: repositories
          VITE_LAUNCH_ENDPOINT: https://code-analysis-launcher.icsarthak9.workers.dev
          VITE_DEFAULT_EXECUTION_REPOSITORY: combustrrr/code-analysis-dashboard
          VITE_DEFAULT_PROJECT_ID: '1360051890'
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Record current deployment assets
        run: find analysis-ui/dist/assets -maxdepth 1 -type f -printf '%f\n' | sort > analysis-ui/dist/current-assets.txt
      - name: Retain assets referenced by recent deployments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A browser tab can keep an older entry chunk in memory across several rapid
          # releases. Retain a bounded history so its lazy imports remain available.
          mapfile -t previous_runs < <(gh run list --workflow pages.yml --branch main --status success --limit 20 --json databaseId --jq '.[].databaseId')
          if [ "${#previous_runs[@]}" -eq 0 ]; then
            echo "No preceding successful Pages deployment is available."
            exit 0
          fi
          for index in "${!previous_runs[@]}"; do
            download="$RUNNER_TEMP/previous-pages-$index"
            site="$RUNNER_TEMP/previous-site-$index"
            mkdir -p "$download" "$site"
            gh run download "${previous_runs[$index]}" --name github-pages --dir "$download"
            tar -xf "$download/artifact.tar" -C "$site"
            if [ -f "$site/current-assets.txt" ]; then
              while IFS= read -r asset; do
                case "$asset" in */*|*..*) echo "Unsafe retained asset name: $asset" >&2; exit 1;; esac
                [ -f "$site/assets/$asset" ] && cp -n "$site/assets/$asset" analysis-ui/dist/assets/
              done < "$site/current-assets.txt"
            elif [ -d "$site/assets" ]; then
              cp -n "$site/assets/"* analysis-ui/dist/assets/
            fi
          done
          echo "Retained assets from up to twenty preceding deployments for cached clients." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication metrics
        if: always()
        run: |
          python -c 'import pathlib; p=pathlib.Path("analysis-ui/dist"); print("Site bytes:",sum(f.stat().st_size for f in p.rglob("*") if f.is_file()))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: analysis-ui/dist
  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
