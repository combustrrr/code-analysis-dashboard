name: API Fuzzing & Reliability
'on':
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  schemathesis-fuzz:
    name: Schemathesis API Fuzzer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kavach_test
        ports:
        - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11.17'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install dependencies & Schemathesis
      run: 'python -m pip install --upgrade pip

        pip install -r backend/requirements.txt

        pip install -r backend/requirements-dev.txt

        pip install "schemathesis==3.39.16" "httpx==0.27.2"

        '
    - name: Start FastAPI Backend in Background
      run: 'cd backend

        TLSOC_AUTH_ENABLED=false uvicorn app.main:app --host 0.0.0.0 --port 8000 &

        sleep 15

        curl -f http://localhost:8000/openapi.json > schema.json || exit 1

        '
    - name: Run API Fuzzing (Schemathesis)
      id: schemathesis
      run: "cd backend\n# Keep this optional breadth pass bounded; deterministic state fuzzing is\n# handled separately below\
        \ and full replay archives are prohibitively large.\nset +e\ntimeout 300 schemathesis run schema.json \\\n  --experimental=openapi-3.1\
        \ \\\n  --base-url http://localhost:8000 \\\n  --checks all \\\n  --max-response-time 5000 \\\n  --hypothesis-max-examples\
        \ 50 \\\n  --junit-xml=../fuzzing-results.xml\nscan_exit=$?\nset -e\n# Exit 1 represents reproducible API findings.\
        \ Timeout or execution/config\n# failures are operational failures and must not be presented as findings.\n# A real\
        \ scan always finalizes a non-empty JUnit document.\nif [[ ! -s ../fuzzing-results.xml ]]; then\n  echo \"Schemathesis\
        \ did not produce a valid JUnit report (exit $scan_exit).\" >&2\n  exit 2\nfi\n[[ \"$scan_exit\" -le 1 ]] || exit\
        \ \"$scan_exit\"\n"
    - name: Upload schemathesis-report to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp fuzzing-results.xml\nbackend/schema.json\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt\
        \ }/schemathesis-report --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
    - name: Parse Results for Aggregation
      if: always()
      run: "# Normalize any 500 crashes into our canonical finding format\npython scripts/code_analysis/normalizer.py \\\n\
        \  --input-dir . \\\n  --output-dir fuzzing-normalized \\\n  --verbose\n"
    - name: Upload fuzzing-findings to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp fuzzing-normalized/ s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/fuzzing-findings
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  atheris-state-machine:
    name: Atheris (Bounded Decision-State Fuzzing)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout exact workflow target
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Set up Python 3.12
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12.15'
        cache: pip
        cache-dependency-path: backend/requirements.txt
    - name: Install bounded fuzz target
      shell: bash
      run: 'set -euo pipefail

        pip install -r backend/requirements.txt "atheris==3.0.0"

        '
    - name: Run deterministic case-decision fuzz campaign
      id: atheris
      shell: bash
      run: "set -euo pipefail\nmkdir -p fuzz-corpus fuzz-crashes\nprintf '\\x00\\xff\\x32\\x01' > fuzz-corpus/seed-false-positive\n\
        printf '\\x01\\xff\\x64\\x02' > fuzz-corpus/seed-true-positive\ncd backend\npython ../tests/security_canary/fuzzing/atheris_state_fuzzer.py\
        \ \\\n  -runs=25000 -max_len=4096 -timeout=5 \\\n  -artifact_prefix=../fuzz-crashes/ ../fuzz-corpus\ncd ..\njq -n\
        \ '{schema_version:\"1\",scanner_family:\"Atheris\",status:\"COMPLETED_OPTIONAL\",reason:\"25,000 bounded inputs executed\
        \ against deterministic case decision logic\",finding_count:0,observation_count:0}' \\\n  > atheris-status.json\n"
    - name: Record Atheris operational failure
      if: failure() && steps.atheris.outcome == 'failure'
      shell: bash
      run: "jq -n '{schema_version:\"1\",scanner_family:\"Atheris\",status:\"OPERATIONAL_FAILURE\",reason:\"The bounded Atheris\
        \ campaign did not complete; inspect the job log and retained crash input.\",finding_count:0,observation_count:0}'\
        \ \\\n  > atheris-status.json\n"
    - name: Upload atheris-state-fuzzing to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp atheris-status.json\nfuzz-crashes/\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt\
        \ }/atheris-state-fuzzing --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
