# Generated by generate_reusable_workflows.py
name: Reusable source analysis
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.identity.outputs.jobs }}
      languages: ${{ steps.identity.outputs.languages }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
        ref: ${{ inputs.tooling_sha }}
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: agentic-soc
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Validate trusted tooling and selected target
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        REQUEST_ID: ${{ inputs.request_id }}
        IS_REUSABLE_ANALYSIS: 'true'
      run: python -m scripts.code_analysis.source_identity
  scanner-1-python-ruff:
    name: Ruff (Python Lint + Format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: agentic-soc
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ${{ runner.temp }}/analysis-tooling/.ci/requirements.txt
    - name: Install pinned tools
      run: python -m pip install --requirement $RUNNER_TEMP/analysis-tooling/.ci/requirements.txt
    - name: Enforce code-analysis workflow policy
      run: python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/audit_workflows.py
    - name: "Ruff lint (default rules \u2014 matches existing python-static CI gate)"
      run: python -m ruff check backend/app backend/tests --exit-zero
    - name: "Ruff lint (extended rules \u2014 advisory for baseline phase)"
      run: "python -m ruff check backend/ \\\n  --config $RUNNER_TEMP/analysis-tooling/config/code-analysis/ruff.toml\
        \ \\\n  --output-format=github \\\n  --exit-zero\n"
    - name: Ruff format check (advisory)
      run: "python -m ruff format --check backend/ \\\n  --config $RUNNER_TEMP/analysis-tooling/config/code-analysis/ruff.toml\
        \ \\\n  || true\n"
    - name: Ruff lint (JSON for normalizer)
      if: always()
      run: "python -m ruff check backend/ \\\n  --config $RUNNER_TEMP/analysis-tooling/config/code-analysis/ruff.toml\
        \ \\\n  --output-format=json \\\n  --exit-zero \\\n  --output-file ruff-results.json\n"
    - name: Upload ruff-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: ruff-results
        path: ruff-results.json
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-ruff') }}
  scanner-1-python-bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: agentic-soc
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: ${{ runner.temp }}/analysis-tooling/.ci/requirements.txt
    - name: Install tools
      run: python -m pip install --requirement $RUNNER_TEMP/analysis-tooling/.ci/requirements.txt
    - name: Run Bandit (JSON, advisory for baseline)
      run: "bandit \\\n  -r backend/ \\\n  -c backend/pyproject.toml \\\n  --format json \\\n  --output bandit-results.json\
        \ \\\n  --exit-zero\n"
    - name: Normalize Bandit JSON to SARIF
      run: "mkdir -p bandit-scan-results\ncp bandit-results.json bandit-scan-results/\npython $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/normalizer.py\
        \ \\\n  --input-dir bandit-scan-results \\\n  --output-dir bandit-normalized\n"
    - name: Report HIGH severity findings (informational)
      if: always()
      run: "python - <<'PY'\nimport json\ndata = json.load(open(\"bandit-results.json\", encoding=\"utf-8\"))\n\
        results = data.get(\"results\", [])\ncounts = {level: sum(r.get(\"issue_severity\") == level for r in results)\n\
        \          for level in (\"CRITICAL\", \"HIGH\", \"MEDIUM\", \"LOW\")}\nprint(f\"Bandit findings: {len(results)}\
        \ total ({counts})\")\nfor finding in results:\n    if finding.get(\"issue_severity\") in {\"CRITICAL\"\
        , \"HIGH\"}:\n        print(f\"  {finding.get('test_id', '')} | {finding.get('filename', '')}:\"\n     \
        \         f\"{finding.get('line_number', '')} | {finding.get('issue_text', '')[:100]}\")\nPY\n"
    - name: Build bounded GitHub Security SARIF view
      run: "python $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/bound_sarif.py \\\n  --input bandit-normalized/normalized.sarif\
        \ \\\n  --output bandit-normalized/github-security.sarif \\\n  --maximum 5000\n"
    - name: Upload bandit-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: bandit-results
        path: 'bandit-results.json

          bandit-normalized/normalized.sarif'
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-bandit') }}
  scanner-1-python-types:
    name: Pyright (Python Type Checking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install dependencies + Pyright
      run: 'python -m pip install --upgrade pip

        pip install -r backend/requirements.txt

        pip install -r backend/requirements-dev.txt

        pip install "pyright==1.1.411"

        '
    - name: Run Pyright (advisory)
      run: "pyright backend/app \\\n  --outputjson > pyright-results.json \\\n  || true\n"
    - name: Upload pyright-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: pyright-results
        path: pyright-results.json
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-types') }}
  scanner-1-typescript-quality:
    name: ESLint + tsc (TypeScript/React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: combustrrr/code-analysis-dashboard
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: agentic-soc
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Node.js 22
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Install locked dependencies
      run: python -I "$RUNNER_TEMP/analysis-tooling/scripts/code_analysis/trusted_entry.py" run_profile javascript-install
        --source "$GITHUB_WORKSPACE"
    - name: TypeScript type check
      shell: bash
      run: 'set +e

        npx tsc --noEmit --pretty false 2>&1 | tee tsc-results.txt

        exit 0

        '
    - name: ESLint lint (human-readable advisory output)
      run: npx eslint "src/**/*.{ts,tsx}" --format stylish || true
    - name: "ESLint lint (fail on error \u2014 matches existing webui-lint CI gate)"
      continue-on-error: true
      run: npx eslint "src/**/*.{ts,tsx}"
    - name: Upload ESLint results (for normalizer)
      if: always()
      run: 'npx eslint "src/**/*.{ts,tsx}" --format json --output-file eslint-results.json || true

        '
    - name: Upload eslint-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: eslint-results
        path: webui/eslint-results.json
        if-no-files-found: error
        retention-days: 7
    - name: Upload tsc-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: tsc-results
        path: webui/tsc-results.txt
        if-no-files-found: error
        retention-days: 7
    - name: Run repository JavaScript test profile
      if: always()
      run: python -I "$RUNNER_TEMP/analysis-tooling/scripts/code_analysis/trusted_entry.py" run_profile javascript-test
        --source "$GITHUB_WORKSPACE"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: typescript-tests
        path: typescript-test-status.json
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    permissions:
      contents: read
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'typescript-quality') }}
  scanner-2-codeql:
    name: CodeQL (Semantic SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.identity.outputs.languages) }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 2
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: agentic-soc
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Stage trusted CodeQL policy in Git metadata
      run: 'mkdir -p "$GITHUB_WORKSPACE/.git/code-analysis"

        cp "$RUNNER_TEMP/analysis-tooling/.github/codeql/codeql-config.yml" "$GITHUB_WORKSPACE/.git/code-analysis/codeql-config.yml"'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        config-file: .git/code-analysis/codeql-config.yml
    - name: "Build (Python \u2014 no explicit build needed)"
      if: matrix.language == 'python'
      run: "echo \"Python \u2014 autobuild skipped, using source\""
    - name: Autobuild (TypeScript/React)
      if: matrix.language == 'javascript-typescript'
      uses: github/codeql-action/autobuild@42947a340483f03ba47bb1a039b2c519aab3df85
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        category: /language:${{ matrix.language }}
        output: codeql-output
        upload: false
    - name: Canonicalize CodeQL SARIF artifact
      shell: bash
      env:
        CODEQL_LANGUAGE: ${{ matrix.language }}
      run: "set -euo pipefail\nmapfile -d '' sarif_files < <(find codeql-output -type f -name '*.sarif' -print0)\n\
        if (( ${#sarif_files[@]} != 1 )); then\n  echo \"::error::Expected exactly one CodeQL SARIF file, found\
        \ ${#sarif_files[@]}\"\n  exit 1\nfi\ncp \"${sarif_files[0]}\" \"codeql-${CODEQL_LANGUAGE}.sarif\"\n"
    - name: Upload codeql-${{ matrix.language }}-sarif as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: codeql-${{ matrix.language }}-sarif
        path: codeql-${{ matrix.language }}.sarif
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'codeql') }}
  scanner-2-semgrep:
    name: Semgrep (Pattern Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: agentic-soc
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install Semgrep
      run: pip install semgrep==1.178.0 click==8.4.2 python-dateutil==2.9.0.post0
    - name: Validate custom Semgrep rules
      run: semgrep --validate --config=$RUNNER_TEMP/analysis-tooling/.github/semgrep-rules/
    - name: Run Semgrep (JSON output)
      run: "semgrep \\\n  --config=p/python \\\n  --config=p/owasp-top-ten \\\n  --config=p/jwt \\\n  --config=p/secrets\
        \ \\\n  --config=p/fastapi \\\n  --config=$RUNNER_TEMP/analysis-tooling/.github/semgrep-rules/ \\\n  --json\
        \ \\\n  --output=semgrep-results.json \\\n  --severity=ERROR \\\n  --severity=WARNING \\\n  backend/ webui/src/\
        \ || true\n"
    - name: Normalize Semgrep JSON to SARIF
      run: "mkdir -p semgrep-scan-results\ncp semgrep-results.json semgrep-scan-results/\npython $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/normalizer.py\
        \ \\\n  --input-dir semgrep-scan-results \\\n  --output-dir semgrep-normalized\n"
    - name: Upload semgrep-sarif as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: semgrep-sarif
        path: semgrep-normalized/normalized.sarif
        if-no-files-found: error
        retention-days: 7
    - name: Upload semgrep-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: semgrep-results
        path: semgrep-results.json
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'semgrep') }}
  scanner-3-osv-scanner:
    name: OSV-Scanner (Dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Run OSV-Scanner
      continue-on-error: true
      uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
      with:
        scan-args: '--lockfile=backend/requirements.txt

          --lockfile=backend/requirements-dev.txt

          --lockfile=webui/package-lock.json

          --format=sarif

          --output=osv-results.sarif'
    - name: Upload osv-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: osv-results
        path: osv-results.sarif
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'osv-scanner') }}
  scanner-3-gitleaks:
    name: Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout (full history for historical scan)
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Run pinned Gitleaks without PR mutation
      run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --report-format=sarif
        --report-path=/repo/gitleaks-results.sarif --redact --exit-code=0
    - name: Validate redacted Gitleaks output
      run: jq -e '(.runs | type) == "array"' gitleaks-results.sarif > /dev/null
    - name: Upload gitleaks-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gitleaks-results
        path: gitleaks-results.sarif
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'gitleaks') }}
  scanner-3-trivy:
    name: Trivy (Filesystem & Container Security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Run Trivy (filesystem scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-fs.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'
    - name: Run Trivy (config scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: config
        scan-ref: .
        format: sarif
        output: trivy-config.sarif
        severity: CRITICAL,HIGH
    - name: Upload trivy-results as artifact
      if: always()
