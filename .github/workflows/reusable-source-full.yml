  scanner-3-shipping-image-security:
    name: Shipping Images (CVEs + SBOM + License Policy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
    - name: Checkout selected source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted SBOM policy tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: agentic-soc
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Build exact-commit shipping images
      env:
        SOURCE_SHA: ${{ fromJSON(inputs.target).head_sha }}
      shell: bash
      run: "set -euo pipefail\nbuild_date=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\ncommon=(--build-arg \"TLSOC_BUILD_SHA=$SOURCE_SHA\"\
        \ --build-arg \"TLSOC_BUILD_DATE=$build_date\")\ndocker build \"${common[@]}\" -t agentic-soc-backend:analysis\
        \ backend\ndocker build \"${common[@]}\" -t agentic-soc-webui:analysis -f webui/Dockerfile .\ndocker image\
        \ inspect agentic-soc-backend:analysis agentic-soc-webui:analysis \\\n  > shipping-image-inspect.json\n"
    - name: Scan backend image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-backend:analysis
        format: sarif
        output: trivy-backend-image.sarif
        severity: CRITICAL,HIGH,MEDIUM,LOW
        exit-code: '0'
    - name: Scan web UI image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-webui:analysis
        format: sarif
        output: trivy-webui-image.sarif
        severity: CRITICAL,HIGH,MEDIUM,LOW
        exit-code: '0'
    - name: Generate backend CycloneDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-backend:analysis
        format: cyclonedx
        output: backend.cdx.json
    - name: Generate web UI CycloneDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-webui:analysis
        format: cyclonedx
        output: webui.cdx.json
    - name: Generate backend SPDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-backend:analysis
        format: spdx-json
        output: backend.spdx.json
    - name: Generate web UI SPDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-webui:analysis
        format: spdx-json
        output: webui.spdx.json
    - name: Evaluate SBOM license policy and emit provenance
      env:
        SOURCE_SHA: ${{ fromJSON(inputs.target).head_sha }}
      shell: bash
      run: "set -euo pipefail\npython $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/validate_sbom.py \\\n\
        \  backend.cdx.json webui.cdx.json backend.spdx.json webui.spdx.json \\\n  --status sbom-policy-status.json\
        \ --sarif sbom-license-policy.sarif\njq -n \\\n  --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"\
        ${SOURCE_SHA,,}\" \\\n  --arg run_id \"$GITHUB_RUN_ID\" \\\n  --slurpfile images shipping-image-inspect.json\
        \ \\\n  '{_type:\"https://in-toto.io/Statement/v1\",subject:($images[0]|map({name:(.RepoTags[0]//\"local-image\"\
        ),digest:{sha256:(.Id|sub(\"^sha256:\";\"\"))}})),predicateType:\"https://slsa.dev/provenance/v1\",predicate:{buildDefinition:{buildType:\"\
        agentic-soc/github-actions-shipping-images/v1\",externalParameters:{repository:$repository,commit:$commit}},runDetails:{builder:{id:\"\
        github-actions\"},metadata:{invocationId:$run_id}}}}' \\\n  > shipping-image-provenance.intoto.json\nimage_findings=\"\
        $(jq -s '[.[].runs[]?.results[]?] | length' \\\n  trivy-backend-image.sarif trivy-webui-image.sarif)\"\n\
        jq -n --argjson findings \"$image_findings\" \\\n  '{schema_version:\"1\",scanner_family:\"Shipping Image\
        \ Trivy\",status:\"COMPLETED_OPTIONAL\",reason:\"Both exact-commit shipping images were built and scanned\"\
        ,finding_count:$findings,observation_count:$findings}' \\\n  > shipping-image-trivy-status.json\n"
    - name: Upload shipping-image-security as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: shipping-image-security
        path: 'trivy-backend-image.sarif

          trivy-webui-image.sarif

          sbom-license-policy.sarif

          sbom-policy-status.json

          backend.cdx.json

          webui.cdx.json

          backend.spdx.json

          webui.spdx.json

          shipping-image-inspect.json

          shipping-image-provenance.intoto.json

          shipping-image-trivy-status.json'
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'shipping-image-security') }}
