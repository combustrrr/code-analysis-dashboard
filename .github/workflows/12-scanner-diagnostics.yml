# Generated scanner diagnostics; never publishes a target report.
name: Scanner access diagnostics
run-name: Scanner diagnostics ${{ inputs.dispatch_id }}
permissions:
  contents: read
concurrency:
  group: scanner-diagnostics-${{ inputs.dispatch_id }}
  cancel-in-progress: false
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.identity.outputs.jobs }}
      languages: ${{ steps.identity.outputs.languages }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Validate trusted tooling and selected target
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        REQUEST_ID: ${{ inputs.request_id }}
      run: python -m scripts.code_analysis.source_identity
'on':
  workflow_dispatch:
    inputs:
      target:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
      dispatch_id:
        required: true
        type: string
