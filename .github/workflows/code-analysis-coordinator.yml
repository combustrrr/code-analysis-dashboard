name: Run analysis
run-name: ${{ github.event_name == 'schedule' && 'Recover accepted analyses' || format('Analyze request {0}', inputs.request_id) }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Durable queue request hint
        required: true
        type: string
      source_sha:
        description: Full source SHA consistency hint
        required: true
        type: string
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
jobs:
  claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      request_id: ${{ steps.contract.outputs.request_id }}
      project_id: ${{ steps.contract.outputs.project_id }}
      tooling_sha: ${{ steps.contract.outputs.tooling_sha }}
      profile_mode: ${{ steps.contract.outputs.profile_mode }}
      target: ${{ steps.contract.outputs.target }}
      generation: ${{ steps.contract.outputs.generation }}
      lease_token: ${{ steps.contract.outputs.lease_token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Claim exact unclaimed analysis channels
        id: claim
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          WAKE_REQUEST_ID: ${{ inputs.request_id }}
          WAKE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --output claim.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer ${WORKER_API_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data "{\"request_id\":\"${WAKE_REQUEST_ID}\",\"source_sha\":\"${WAKE_SOURCE_SHA}\"}" \
            "${WORKER_URL}/api/internal/queue/claim")
          if [[ "$status" == 204 || "$status" == 409 ]]; then
            echo 'claimed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$status" == 200
          echo 'claimed=true' >> "$GITHUB_OUTPUT"
      - name: Validate immutable queue contract
        if: steps.claim.outputs.claimed == 'true'
        id: contract
        run: python -m scripts.code_analysis.queue_contract claim.json
      - name: Bind the lease to this exact workflow attempt
        if: steps.claim.outputs.claimed == 'true'
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          REQUEST_ID: ${{ steps.contract.outputs.request_id }}
          GENERATION: ${{ steps.contract.outputs.generation }}
          LEASE_TOKEN: ${{ steps.contract.outputs.lease_token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${WORKER_API_TOKEN}" --header 'Content-Type: application/json' \
            --data "{\"request_id\":\"${REQUEST_ID}\",\"generation\":${GENERATION},\"lease_token\":\"${LEASE_TOKEN}\",\"workflow_run_id\":${GITHUB_RUN_ID},\"workflow_run_attempt\":${GITHUB_RUN_ATTEMPT}}" \
            "${WORKER_URL}/api/internal/queue/heartbeat"
  heartbeat:
    if: needs.claim.outputs.claimed == 'true'
    needs: claim
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production
    permissions: {}
    steps:
      - name: Renew only this fenced lease
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          REQUEST_ID: ${{ needs.claim.outputs.request_id }}
          GENERATION: ${{ needs.claim.outputs.generation }}
          LEASE_TOKEN: ${{ needs.claim.outputs.lease_token }}
        run: |
          # The terminal completion call invalidates this lease. Check once per minute so
          # the heartbeat job stops promptly instead of leaving a published run looking
          # active for up to five additional minutes.
          while sleep 60; do
            curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer ${WORKER_API_TOKEN}" --header 'Content-Type: application/json' \
              --data "{\"request_id\":\"${REQUEST_ID}\",\"generation\":${GENERATION},\"lease_token\":\"${LEASE_TOKEN}\",\"workflow_run_id\":${GITHUB_RUN_ID},\"workflow_run_attempt\":${GITHUB_RUN_ATTEMPT}}" \
              "${WORKER_URL}/api/internal/queue/heartbeat" || exit 0
          done
  vendor:
    if: needs.claim.outputs.claimed == 'true'
    needs: claim
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/reusable-vendor.yml
    with:
      tooling_sha: ${{ needs.claim.outputs.tooling_sha }}
      target: ${{ needs.claim.outputs.target }}
      request_id: ${{ needs.claim.outputs.request_id }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
      CODERABBIT_GITHUB_TOKEN: ${{ secrets.CODERABBIT_GITHUB_TOKEN }}
  portable_profile:
    name: Source scanners · portable profile
    if: always() && needs.claim.outputs.claimed == 'true' && needs.claim.outputs.profile_mode == 'portable'
    needs: claim
    permissions:
      contents: read
      actions: read
      security-events: read
    uses: ./.github/workflows/reusable-source.yml
    with:
      tooling_sha: ${{ needs.claim.outputs.tooling_sha }}
      target: ${{ needs.claim.outputs.target }}
      request_id: ${{ needs.claim.outputs.request_id }}
  agentic_profile:
    name: Source scanners · agentic-soc profile
    if: always() && needs.claim.outputs.claimed == 'true' && needs.claim.outputs.profile_mode == 'agentic-soc'
    needs: claim
    permissions:
      contents: read
      actions: read
      security-events: read
    uses: ./.github/workflows/reusable-source-full.yml
    with:
      tooling_sha: ${{ needs.claim.outputs.tooling_sha }}
      target: ${{ needs.claim.outputs.target }}
      request_id: ${{ needs.claim.outputs.request_id }}
  publish:
    if: always() && needs.claim.outputs.claimed == 'true'
    needs: [claim, vendor, portable_profile, agentic_profile]
    runs-on: ubuntu-24.04
    concurrency:
      group: analysis-publication-${{ needs.claim.outputs.project_id }}
      cancel-in-progress: false
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.claim.outputs.tooling_sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Verify the publication fence is still active
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          REQUEST_ID: ${{ needs.claim.outputs.request_id }}
          GENERATION: ${{ needs.claim.outputs.generation }}
          LEASE_TOKEN: ${{ needs.claim.outputs.lease_token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${WORKER_API_TOKEN}" --header 'Content-Type: application/json' \
            --data "{\"request_id\":\"${REQUEST_ID}\",\"generation\":${GENERATION},\"lease_token\":\"${LEASE_TOKEN}\",\"workflow_run_id\":${GITHUB_RUN_ID},\"workflow_run_attempt\":${GITHUB_RUN_ATTEMPT},\"publication\":true}" \
            "${WORKER_URL}/api/internal/queue/heartbeat"
      - name: Publish only validated artifacts from this coordinator attempt
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          QUEUE_INTENT: ${{ toJSON(fromJSON(needs.claim.outputs.target).queue_intent) }}
        run: python -m scripts.code_analysis.repository_service
  complete:
    if: always() && needs.claim.outputs.claimed == 'true'
    needs: [claim, vendor, portable_profile, agentic_profile, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - name: Record terminal queue state
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          REQUEST_ID: ${{ needs.claim.outputs.request_id }}
          GENERATION: ${{ needs.claim.outputs.generation }}
          LEASE_TOKEN: ${{ needs.claim.outputs.lease_token }}
          PORTABLE_RESULT: ${{ needs.portable_profile.result }}
          CONFIGURED_RESULT: ${{ needs.agentic_profile.result }}
          VENDOR_RESULT: ${{ needs.vendor.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          status=published
          # Individual scanner lanes may fail while the evidence collector still
          # validates and publishes an explicit partial report. Publication is
          # the request-level outcome; lane results remain report limitations.
          if [[ "$PUBLISH_RESULT" != success ]]; then status=failed; fi
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer ${WORKER_API_TOKEN}" --header 'Content-Type: application/json' \
            --data "{\"request_id\":\"${REQUEST_ID}\",\"generation\":${GENERATION},\"lease_token\":\"${LEASE_TOKEN}\",\"status\":\"${status}\",\"result\":{\"run_id\":${GITHUB_RUN_ID},\"run_attempt\":${GITHUB_RUN_ATTEMPT},\"publication_status\":\"${PUBLISH_RESULT}\",\"scanner_lanes\":{\"vendor\":\"${VENDOR_RESULT}\",\"portable\":\"${PORTABLE_RESULT}\",\"configured\":\"${CONFIGURED_RESULT}\"}}}" \
            "${WORKER_URL}/api/internal/queue/complete"
