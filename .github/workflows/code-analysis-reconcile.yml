name: Code analysis reconciliation
on:
  workflow_dispatch:
    inputs:
      project_id:
        type: string
        required: false
      selection:
        type: string
        required: false
      request_id:
        type: string
        required: false
  workflow_run:
    workflows: ['Code analysis source']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: code-analysis-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    permissions:
      contents: write
      actions: write
      checks: write
      security-events: write
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-reconcile.yml@733e50f45c3276f50eb69999a19619899d7105db
    with:
      tooling_sha: 733e50f45c3276f50eb69999a19619899d7105db
      project_id: ${{ inputs.project_id || '' }}
      selection: ${{ inputs.selection || '' }}
      request_id: ${{ inputs.request_id || '' }}
