name: Code analysis reconciliation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Code analysis source', 'Source analysis']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: code-analysis-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    permissions:
      contents: write
      actions: write
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-reconcile.yml@2f97903a2b5bcc0ab22d823c12f7acc9618bcbb0
    with:
      tooling_sha: 2f97903a2b5bcc0ab22d823c12f7acc9618bcbb0
      project_id: ''
      selection: ''
      request_id: ''
    secrets: inherit
