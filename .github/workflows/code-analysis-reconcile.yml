name: Code analysis reconciliation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Code analysis source', 'Source analysis']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: code-analysis-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    permissions:
      contents: write
      actions: write
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-reconcile.yml@2c330c45f8f750a496b2bfce63f0ab3f7c9ba9a1
    with:
      tooling_sha: 2c330c45f8f750a496b2bfce63f0ab3f7c9ba9a1
      project_id: ''
      selection: ''
      request_id: ''
    secrets: inherit
