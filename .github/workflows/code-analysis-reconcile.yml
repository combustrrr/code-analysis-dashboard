name: Code analysis reconciliation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Code analysis source', 'Source analysis']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: code-analysis-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    permissions:
      contents: write
      actions: write
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-reconcile.yml@7e880ec0cef4aed4501f843a6d196d7068c5ab8f
    with:
      tooling_sha: 7e880ec0cef4aed4501f843a6d196d7068c5ab8f
      project_id: ''
      selection: ''
      request_id: ''
    secrets: inherit
