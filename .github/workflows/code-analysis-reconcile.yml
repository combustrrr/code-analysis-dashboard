name: Code analysis reconciliation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Code analysis source', 'Source analysis']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: code-analysis-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    permissions:
      contents: write
      actions: write
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-reconcile.yml@78a53f316244cef3f701b190bd1146ef45d2bb07
    with:
      tooling_sha: 78a53f316244cef3f701b190bd1146ef45d2bb07
      project_id: ''
      selection: ''
      request_id: ''
    secrets: inherit
