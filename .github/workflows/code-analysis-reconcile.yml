name: Code analysis reconciliation
on:
  workflow_dispatch:
    inputs:
      project_id:
        type: string
        required: false
      selection:
        type: string
        required: false
      request_id:
        type: string
        required: false
  workflow_run:
    workflows: ['Code analysis source']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: code-analysis-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    permissions:
      contents: write
      actions: write
      checks: write
      security-events: write
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-reconcile.yml@fd0e887cc39b0fcd4d4c029164d6fa9aa7c704a0
    with:
      tooling_sha: fd0e887cc39b0fcd4d4c029164d6fa9aa7c704a0
      project_id: ${{ inputs.project_id || '' }}
      selection: ${{ inputs.selection || '' }}
      request_id: ${{ inputs.request_id || '' }}
    secrets: inherit
