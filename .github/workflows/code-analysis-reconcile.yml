name: Code analysis reconciliation
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Code analysis source', 'Source analysis']
    types: [completed]
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: code-analysis-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    permissions:
      contents: write
      actions: write
    uses: combustrrr/code-analysis-dashboard/.github/workflows/reusable-reconcile.yml@f10e6a6fe64998908c1f19ec560238448621d1e9
    with:
      tooling_sha: f10e6a6fe64998908c1f19ec560238448621d1e9
      project_id: ''
      selection: ''
      request_id: ''
    secrets: inherit
