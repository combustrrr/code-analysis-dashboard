name: Canary Coverage Validation
true:
  workflow_dispatch: null
  push:
    branches:
    - feature/static-code-analysis
    paths:
    - .github/semgrep-rules/**
    - .github/codeql/**
    - .github/workflows/02-security-sast.yml
    - .github/workflows/03-dependency-security.yml
    - .github/workflows/06-canary-validation.yml
    - scripts/code_analysis/**
    - tests/security_canary/**
permissions:
  contents: read
jobs:
  canary-scan:
    name: Scan Canary Suite with All Tools
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: .ci/requirements.txt
    - name: Initialize canary-only CodeQL
      uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        languages: python,javascript-typescript
        queries: +security-extended,security-and-quality
        config-file: .github/codeql/codeql-canary-config.yml
    - name: Analyze canary fixtures with CodeQL
      uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        output: canary-results-codeql
        upload: false
    - name: Install tools
      run: 'python -m pip install --requirement .ci/requirements.txt

        python -m pip install "checkov==3.2.468"

        '
    - name: Prepare non-ignored canary scan root
      run: 'mkdir -p canary-input/canary

        cp -R tests/security_canary/. canary-input/canary/

        '
    - name: Run Semgrep on canary suite
      run: "semgrep \\\n  --config=.github/semgrep-rules/ \\\n  --config=p/python \\\n  --config=p/owasp-top-ten \\\n  --config=p/jwt\
        \ \\\n  --no-git-ignore \\\n  --json \\\n  --output=canary-results-semgrep.json \\\n  canary-input/canary/ || true\n"
    - name: Run Bandit on canary suite
      run: "bandit \\\n  -r tests/security_canary/python/ \\\n  --format json \\\n  --output canary-results-bandit.json \\\
        \n  --exit-zero || true\n"
    - name: Run Ruff on canary suite
      run: "ruff check tests/security_canary/ \\\n  --output-format=json \\\n  --exit-zero \\\n  > canary-results-ruff.json\
        \ || true\n"
    - name: Run Gitleaks on canary suite
      run: "mkdir -p canary-gitleaks-input/canary/python\ncp tests/security_canary/python/hardcoded_secret.py canary-gitleaks-input/canary/python/\n\
        docker run --rm -v \"$PWD:/repo\" zricethezav/gitleaks:v8.24.2 detect \\\n  --source /repo/canary-gitleaks-input \\\
        \n  --config /repo/.gitleaks.toml \\\n  --no-git \\\n  --report-format=sarif \\\n  --report-path /repo/canary-results-gitleaks.sarif\
        \ \\\n  --exit-code 0 || true\n"
    - name: Run OSV-Scanner on vulnerable canary dependencies
      shell: bash
      run: cp tests/security_canary/requirements-vulnerable.fixture canary-input/requirements-vulnerable.txt
    - name: Scan vulnerable canary dependencies with OSV-Scanner
      continue-on-error: true
      uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
      with:
        scan-args: '--lockfile=canary-input/requirements-vulnerable.txt

          --format=sarif

          --output=canary-results-osv.sarif'
    - name: Run Hadolint on insecure canary Dockerfile
      uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
      with:
        dockerfile: tests/security_canary/Dockerfile.insecure
        format: sarif
        output-file: canary-results-hadolint.sarif
        no-fail: true
    - name: Run Checkov on insecure canary Dockerfile
      run: "checkov \\\n  --file tests/security_canary/Dockerfile.insecure \\\n  --framework dockerfile \\\n  --output sarif\
        \ \\\n  --output-file-path canary-results-checkov.sarif \\\n  --soft-fail || true\n"
    - name: Collect all canary scan outputs
      run: "mkdir -p canary-scan-results\ncp canary-results-semgrep.json canary-scan-results/ 2>/dev/null || true\ncp canary-results-bandit.json\
        \ canary-scan-results/ 2>/dev/null || true\ncp canary-results-ruff.json canary-scan-results/ 2>/dev/null || true\n\
        cp canary-results-gitleaks.sarif canary-scan-results/ 2>/dev/null || true\ncp canary-results-osv.sarif canary-scan-results/\
        \ 2>/dev/null || true\ncp canary-results-hadolint.sarif canary-scan-results/ 2>/dev/null || true\nfind canary-results-checkov.sarif\
        \ -type f -name '*.sarif' \\\n  -exec cp {} canary-scan-results/canary-results-checkov.sarif \\; 2>/dev/null || true\n\
        cp -R canary-results-codeql canary-scan-results/ 2>/dev/null || true\n"
    - name: Normalize canary findings
      run: "python scripts/code_analysis/normalizer.py \\\n  --input-dir canary-scan-results \\\n  --output-dir canary-normalized\
        \ \\\n  --verbose\n"
    - name: "Validate coverage \u2014 integration test"
      run: "python scripts/code_analysis/validate_canary.py \\\n  --findings-dir canary-normalized \\\n  --verbose\n"
    - name: Upload canary-validation-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp canary-scan-results/\ncanary-normalized/\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt\
        \ }/canary-validation-results --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
    - name: Post coverage summary
      if: always()
      run: "echo \"## \U0001F6E1\uFE0F Canary Coverage Results\" >> \"$GITHUB_STEP_SUMMARY\"\necho \"\" >> \"$GITHUB_STEP_SUMMARY\"\
        \nif [ -f canary-normalized/deduplicated-findings.json ]; then\n  COUNT=$(python -c \"import json; d=json.load(open('canary-normalized/deduplicated-findings.json'));\
        \ print(len(d))\")\n  echo \"- **Total canary findings (deduplicated):** $COUNT\" >> \"$GITHUB_STEP_SUMMARY\"\nfi\n\
        echo \"- **Run date:** $(date -u +%Y-%m-%d)\" >> \"$GITHUB_STEP_SUMMARY\"\n"
