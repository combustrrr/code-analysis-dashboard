# Generated by generate_reusable_workflows.py
name: Reusable source analysis
permissions:
  contents: read
concurrency:
  group: source-${{ fromJSON(inputs.target).id }}
  cancel-in-progress: true
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.identity.outputs.jobs }}
      languages: ${{ steps.identity.outputs.languages }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
        ref: ${{ inputs.tooling_sha }}
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Validate trusted tooling and selected target
      id: identity
      env:
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        IS_REUSABLE_ANALYSIS: 'true'
      run: python -m scripts.code_analysis.source_identity
  scanner-2-codeql:
    name: CodeQL (Semantic SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.identity.outputs.languages) }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 2
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Stage trusted CodeQL policy in Git metadata
      run: 'mkdir -p "$GITHUB_WORKSPACE/.git/code-analysis"

        cp "$RUNNER_TEMP/analysis-tooling/.github/codeql/codeql-config.yml" "$GITHUB_WORKSPACE/.git/code-analysis/codeql-config.yml"'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        build-mode: none
    - name: "Build (Python \u2014 no explicit build needed)"
      if: matrix.language == 'python'
      run: "echo \"Python \u2014 autobuild skipped, using source\""
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      with:
        category: /language:${{ matrix.language }}
        output: codeql-output
        upload: false
    - name: Canonicalize CodeQL SARIF artifact
      shell: bash
      env:
        CODEQL_LANGUAGE: ${{ matrix.language }}
      run: "set -euo pipefail\nmapfile -d '' sarif_files < <(find codeql-output -type f -name '*.sarif' -print0)\n\
        if (( ${#sarif_files[@]} != 1 )); then\n  echo \"::error::Expected exactly one CodeQL SARIF file, found\
        \ ${#sarif_files[@]}\"\n  exit 1\nfi\ncp \"${sarif_files[0]}\" \"codeql-${CODEQL_LANGUAGE}.sarif\"\n"
    - name: Upload SARIF artifact (for normalizer)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: codeql-${{ matrix.language }}-sarif
        path: codeql-${{ matrix.language }}.sarif
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'codeql') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-2-semgrep:
    name: Semgrep (Pattern Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.11.16
    - name: Install Semgrep
      run: pip install semgrep==1.80.0 click==8.1.7 python-dateutil==2.9.0.post0
    - name: Validate custom Semgrep rules
      run: semgrep --validate --config=$RUNNER_TEMP/analysis-tooling/.github/semgrep-rules/
    - name: Run Semgrep (JSON output)
      run: semgrep --config=p/owasp-top-ten --config=p/secrets --json --output=semgrep-results.json .
    - name: Normalize Semgrep JSON to SARIF
      run: "mkdir -p semgrep-scan-results\ncp semgrep-results.json semgrep-scan-results/\npython $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/normalizer.py\
        \ \\\n  --input-dir semgrep-scan-results \\\n  --output-dir semgrep-normalized\n"
    - name: Upload SARIF artifact (for normalizer)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: semgrep-sarif
        path: semgrep-normalized/normalized.sarif
        retention-days: 7
    - name: Upload JSON results (for normalizer)
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: semgrep-results
        path: semgrep-results.json
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'semgrep') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-3-gitleaks:
    name: Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout (full history for historical scan)
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Run pinned Gitleaks without PR mutation
      run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --report-format=sarif
        --report-path=/repo/gitleaks-results.sarif --redact --exit-code=0
    - name: Validate redacted Gitleaks output
      run: jq -e '(.runs | type) == "array"' gitleaks-results.sarif > /dev/null
    - name: Upload Gitleaks results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gitleaks-results
        path: gitleaks-results.sarif
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'gitleaks') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-3-trivy:
    name: Trivy (Filesystem & Container Security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Run Trivy (filesystem scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-fs.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'
    - name: Run Trivy (config scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: config
        scan-ref: .
        format: sarif
        output: trivy-config.sarif
        severity: CRITICAL,HIGH
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: trivy-results
        path: 'trivy-fs.sarif

          trivy-config.sarif

          '
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'trivy') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-3-checkov:
    name: Checkov (IaC Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.11.16
    - name: Install Checkov
      run: pip install "checkov==3.2.468"
    - name: Run Checkov
      run: "checkov \\\n  --directory . \\\n  --framework dockerfile,github_actions \\\n  --output sarif \\\n  --output-file-path\
        \ checkov.sarif \\\n  --soft-fail || true\n"
    - name: Canonicalize Checkov SARIF artifact
      shell: bash
      run: "set -euo pipefail\nif [[ -d checkov.sarif ]]; then\n  mapfile -d '' sarif_files < <(find checkov.sarif\
        \ -type f -name '*.sarif' -print0)\n  if (( ${#sarif_files[@]} != 1 )); then\n    echo \"::error::Expected\
        \ exactly one Checkov SARIF file, found ${#sarif_files[@]}\"\n    exit 1\n  fi\n  cp \"${sarif_files[0]}\"\
        \ checkov-results.sarif\nelif [[ -f checkov.sarif ]]; then\n  cp checkov.sarif checkov-results.sarif\nelse\n\
        \  echo \"::error::Checkov did not produce SARIF evidence\"\n  exit 1\nfi\n"
    - name: Upload artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: checkov-results
        path: checkov-results.sarif
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'checkov') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-3-workflow-security-posture:
    name: Workflow Security (zizmor + Scorecard + Secret Posture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout selected source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Install and run pinned zizmor
      shell: bash
      run: 'set -euo pipefail

        pip install "zizmor==1.29.0"

        set +e

        zizmor --format sarif .github > zizmor-results.sarif

        scan_exit=$?

        set -e

        [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

        '
    - name: Observe GitHub secret-scanning posture
      env:
        GH_TOKEN: ${{ secrets.SECURITY_POSTURE_TOKEN || github.token }}
      shell: bash
      run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${SOURCE_REPOSITORY}\")\"\nsecret_scanning=\"$(jq -r\
        \ '.security_and_analysis.secret_scanning.status // \"UNAVAILABLE\"' <<<\"$repo_json\")\"\npush_protection=\"\
        $(jq -r '.security_and_analysis.secret_scanning_push_protection.status // \"UNAVAILABLE\"' <<<\"$repo_json\"\
        )\"\nalerts_status=UNAVAILABLE\nalert_count=null\nif gh api --paginate \"repos/${SOURCE_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100\"\
        \ \\\n    --jq '.[].number' > secret-scanning-alert-numbers.txt 2>secret-scanning-api.log; then\n  alerts_status=OBSERVED\n\
        \  alert_count=\"$(wc -l < secret-scanning-alert-numbers.txt)\"\nelse\n  : > secret-scanning-alert-numbers.txt\n\
        fi\nposture_status=CONFIGURED_COMPLETE\nposture_reason=\"Secret scanning and push protection enabled; open-alert\
        \ count observed without secret values\"\nif [[ \"$secret_scanning\" == UNAVAILABLE || \"$push_protection\"\
        \ == UNAVAILABLE || \"$alerts_status\" == UNAVAILABLE ]]; then\n  posture_status=CONFIGURED_PARTIAL\n  posture_reason=\"\
        GitHub token cannot observe one or more secret-protection controls; configure a read-only SECURITY_POSTURE_TOKEN\"\
        \nelif [[ \"$secret_scanning\" != enabled || \"$push_protection\" != enabled ]]; then\n  posture_status=CONFIGURED_PARTIAL\n\
        \  posture_reason=\"One or more GitHub secret-protection controls require repository-owner activation\"\n\
        fi\njq -n --arg status \"$posture_status\" --arg reason \"$posture_reason\" \\\n  --arg scanning \"$secret_scanning\"\
        \ \\\n  --arg protection \"$push_protection\" --arg alerts \"$alerts_status\" \\\n  --argjson count \"$alert_count\"\
        \ \\\n  '{schema_version:\"1\",scanner_family:\"Repository Security Posture\",status:$status,reason:$reason,secret_scanning:$scanning,push_protection:$protection,alerts_status:$alerts,open_alert_count:$count,finding_count:0,observation_count:0}'\
        \ \\\n  > repository-security-posture-status.json\n"
    - name: Retain workflow and platform posture
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: workflow-security-posture
        path: 'zizmor-results.sarif

          repository-security-posture-status.json

          secret-scanning-alert-numbers.txt

          secret-scanning-api.log

          '
        if-no-files-found: error
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'workflow-security-posture') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  scanner-3-openssf-scorecard:
    name: OpenSSF Scorecard (Repository Supply Chain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - name: Install verified Scorecard 5.5.0
      run: 'curl --fail --location --retry 3 https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz
        -o scorecard.tar.gz

        echo "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff  scorecard.tar.gz" | sha256sum --check

        tar -xzf scorecard.tar.gz scorecard

        '
    - name: Scan external repository at selected commit
      id: scorecard
      continue-on-error: true
      env:
        GITHUB_AUTH_TOKEN: ${{ github.token }}
        ENABLE_SARIF: 'true'
        SOURCE_SHA: ${{ fromJSON(inputs.target).head_sha }}
      run: './scorecard --repo="github.com/$SOURCE_REPOSITORY" --commit="$SOURCE_SHA" --format=json --show-details
        > scorecard-native.json

        python -I scripts/code_analysis/scorecard_report.py'
    - name: Retain Scorecard execution status
      if: always()
      env:
        OUTCOME: ${{ steps.scorecard.outcome }}
      run: "if [[ \"$OUTCOME\" != success ]]; then\n  jq -n '{scanner_family:\"OpenSSF Scorecard\",status:\"OPERATIONAL_FAILURE\"\
        ,reason:\"Native Scorecard execution or source identity validation failed\"}' > scorecard-status.json\n\
        fi"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: openssf-scorecard
        path: 'openssf-scorecard.sarif

          scorecard-status.json

          scorecard-native.json'
        retention-days: 7
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'openssf-scorecard') }}
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
  portable-python-bandit:
    name: Portable python-bandit
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-bandit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install pinned scanner dependencies
      run: python -m pip install -r .ci/requirements.txt
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Run reviewed bandit adapter
      run: python -I scripts/code_analysis/trusted_entry.py portable_runner bandit --source .source --output portable-output/bandit
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: portable-python-bandit
        path: portable-output/
        retention-days: 7
        if-no-files-found: error
  portable-python-ruff:
    name: Portable python-ruff
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-ruff') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install pinned scanner dependencies
      run: python -m pip install -r .ci/requirements.txt
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Run reviewed ruff adapter
      run: python -I scripts/code_analysis/trusted_entry.py portable_runner ruff --source .source --output portable-output/ruff
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: portable-python-ruff
        path: portable-output/
        retention-days: 7
        if-no-files-found: error
  portable-complexity:
    name: Portable complexity
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'complexity') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install pinned scanner dependencies
      run: python -m pip install -r .ci/requirements.txt
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Run reviewed radon adapter
      run: python -I scripts/code_analysis/trusted_entry.py portable_runner radon --source .source --output portable-output/radon
    - name: Run reviewed xenon adapter
      run: python -I scripts/code_analysis/trusted_entry.py portable_runner xenon --source .source --output portable-output/xenon
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: portable-complexity
        path: portable-output/
        retention-days: 7
        if-no-files-found: error
  portable-dead-code:
    name: Portable dead-code
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'dead-code') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
