        path: .hosted/report/
        if-no-files-found: error
        retention-days: 7
'on':
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
    secrets:
      SECURITY_POSTURE_TOKEN:
        required: false
