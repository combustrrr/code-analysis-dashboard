# Generated by generate_reusable_workflows.py
name: Reusable source analysis
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.identity.outputs.jobs }}
      languages: ${{ steps.identity.outputs.languages }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
        ref: ${{ inputs.tooling_sha }}
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Validate trusted tooling and selected target
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        REQUEST_ID: ${{ inputs.request_id }}
        IS_REUSABLE_ANALYSIS: 'true'
      run: python -m scripts.code_analysis.source_identity
  scanner-2-codeql:
    name: CodeQL (Semantic SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.identity.outputs.languages) }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 2
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Stage trusted CodeQL policy in Git metadata
      run: 'mkdir -p "$GITHUB_WORKSPACE/.git/code-analysis"

        cp "$RUNNER_TEMP/analysis-tooling/.github/codeql/codeql-config.yml" "$GITHUB_WORKSPACE/.git/code-analysis/codeql-config.yml"'
    - name: Initialize CodeQL
      uses: github/codeql-action/init@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        build-mode: none
    - name: "Build (Python \u2014 no explicit build needed)"
      if: matrix.language == 'python'
      run: "echo \"Python \u2014 autobuild skipped, using source\""
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        category: /language:${{ matrix.language }}
        output: codeql-output
        upload: false
    - name: Canonicalize CodeQL SARIF artifact
      shell: bash
      env:
        CODEQL_LANGUAGE: ${{ matrix.language }}
      run: "set -euo pipefail\nmapfile -d '' sarif_files < <(find codeql-output -type f -name '*.sarif' -print0)\n\
        if (( ${#sarif_files[@]} != 1 )); then\n  echo \"::error::Expected exactly one CodeQL SARIF file, found\
        \ ${#sarif_files[@]}\"\n  exit 1\nfi\ncp \"${sarif_files[0]}\" \"codeql-${CODEQL_LANGUAGE}.sarif\"\n"
    - name: Upload codeql-${{ matrix.language }}-sarif as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: codeql-${{ matrix.language }}-sarif
        path: codeql-${{ matrix.language }}.sarif
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'codeql') }}
  scanner-2-semgrep:
    name: Semgrep (Pattern Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        path: .analysis-tooling
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/.analysis-tooling/scripts/code_analysis/prepare_project.py"
    - name: Keep trusted tooling outside the source scan tree
      run: mv "$GITHUB_WORKSPACE/.analysis-tooling" "$RUNNER_TEMP/analysis-tooling"
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.11.17
    - name: Install Semgrep
      run: pip install semgrep==1.178.0 click==8.4.2 python-dateutil==2.9.0.post0
    - name: Validate custom Semgrep rules
      run: semgrep --validate --config=$RUNNER_TEMP/analysis-tooling/.github/semgrep-rules/
    - name: Run Semgrep (JSON output)
      run: semgrep --config=p/owasp-top-ten --config=p/secrets --json --output=semgrep-results.json .
    - name: Normalize Semgrep JSON to SARIF
      run: "mkdir -p semgrep-scan-results\ncp semgrep-results.json semgrep-scan-results/\npython $RUNNER_TEMP/analysis-tooling/scripts/code_analysis/normalizer.py\
        \ \\\n  --input-dir semgrep-scan-results \\\n  --output-dir semgrep-normalized\n"
    - name: Upload semgrep-sarif as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: semgrep-sarif
        path: semgrep-normalized/normalized.sarif
        if-no-files-found: error
        retention-days: 7
    - name: Upload semgrep-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: semgrep-results
        path: semgrep-results.json
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'semgrep') }}
  scanner-3-gitleaks:
    name: Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout (full history for historical scan)
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        fetch-depth: 0
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Run pinned Gitleaks without PR mutation
      run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --report-format=sarif
        --report-path=/repo/gitleaks-results.sarif --redact --exit-code=0
    - name: Validate redacted Gitleaks output
      run: jq -e '(.runs | type) == "array"' gitleaks-results.sarif > /dev/null
    - name: Upload gitleaks-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: gitleaks-results
        path: gitleaks-results.sarif
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'gitleaks') }}
  scanner-3-trivy:
    name: Trivy (Filesystem & Container Security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Run Trivy (filesystem scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-fs.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'
    - name: Run Trivy (config scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: config
        scan-ref: .
        format: sarif
        output: trivy-config.sarif
        severity: CRITICAL,HIGH
    - name: Upload trivy-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: trivy-results
        path: 'trivy-fs.sarif

          trivy-config.sarif'
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'trivy') }}
  scanner-3-checkov:
    name: Checkov (IaC Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ fromJSON(inputs.target).head_sha }}
        persist-credentials: false
        repository: ${{ fromJSON(inputs.target).source_repository }}
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.11.17
    - name: Install Checkov
      run: pip install "checkov==3.2.468"
    - name: Run Checkov
      run: "checkov \\\n  --directory . \\\n  --framework dockerfile,github_actions \\\n  --output sarif \\\n  --output-file-path\
        \ checkov.sarif \\\n  --soft-fail || true\n"
    - name: Canonicalize Checkov SARIF artifact
      shell: bash
      run: "set -euo pipefail\nif [[ -d checkov.sarif ]]; then\n  mapfile -d '' sarif_files < <(find checkov.sarif\
        \ -type f -name '*.sarif' -print0)\n  if (( ${#sarif_files[@]} != 1 )); then\n    echo \"::error::Expected\
        \ exactly one Checkov SARIF file, found ${#sarif_files[@]}\"\n    exit 1\n  fi\n  cp \"${sarif_files[0]}\"\
        \ checkov-results.sarif\nelif [[ -f checkov.sarif ]]; then\n  cp checkov.sarif checkov-results.sarif\nelse\n\
        \  echo \"::error::Checkov did not produce SARIF evidence\"\n  exit 1\nfi\n"
    - name: Upload checkov-results as artifact
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: checkov-results
        path: checkov-results.sarif
        if-no-files-found: error
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'checkov') }}
  scanner-3-openssf-scorecard:
    name: OpenSSF Scorecard (Repository Supply Chain)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - name: Install verified Scorecard 5.5.0
      run: 'curl --fail --location --retry 3 https://github.com/ossf/scorecard/releases/download/v5.5.0/scorecard_5.5.0_linux_amd64.tar.gz
        -o scorecard.tar.gz

        echo "83b90a05c1540ef1390db1cd5711e5fd04be9c1d8537fb84d39d02092d6a8dff  scorecard.tar.gz" | sha256sum --check

        tar -xzf scorecard.tar.gz scorecard

        '
    - name: Scan external repository at selected commit
      id: scorecard
      continue-on-error: true
      env:
        GITHUB_AUTH_TOKEN: ${{ github.token }}
        ENABLE_SARIF: 'true'
        SOURCE_SHA: ${{ fromJSON(inputs.target).head_sha }}
      run: './scorecard --repo="github.com/$SOURCE_REPOSITORY" --commit="$SOURCE_SHA" --format=json --show-details
        > scorecard-native.json

        python -I scripts/code_analysis/scorecard_report.py'
    - name: Retain Scorecard execution status
      if: always()
      env:
        OUTCOME: ${{ steps.scorecard.outcome }}
      run: "if [[ \"$OUTCOME\" != success ]]; then\n  jq -n '{scanner_family:\"OpenSSF Scorecard\",status:\"OPERATIONAL_FAILURE\"\
        ,reason:\"Native Scorecard execution or source identity validation failed\"}' > scorecard-status.json\n\
        fi"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: openssf-scorecard
        path: 'openssf-scorecard.sarif

          scorecard-status.json

          scorecard-native.json'
        retention-days: 7
    env:
      SOURCE_REPOSITORY: ${{ fromJSON(inputs.target).source_repository }}
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'openssf-scorecard') }}
  community-github-actions-security:
    name: GitHub Actions security (zizmor)
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'github-actions-security') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - &id001
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - &id002
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - &id003
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Install pinned zizmor
      run: python -m pip install zizmor==1.31.1
    - name: Analyze exact-revision workflow definitions
      run: zizmor --format sarif .source/.github/workflows > github-actions-security.sarif
    - name: Record completed zizmor evidence
      run: printf '%s\n' '{"scanner_family":"zizmor","status":"COMPLETED","reason":"Native SARIF retained for the
        exact revision.","scanner_version":"1.31.1"}' > zizmor-status.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: github-actions-security
        path: 'github-actions-security.sarif

          zizmor-status.json'
        if-no-files-found: error
        retention-days: 7
  community-owasp-js:
    name: OWASP JavaScript security (njsscan)
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'owasp-js') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - *id001
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - *id002
    - *id003
    - name: Install pinned njsscan
      run: python -m pip install njsscan==1.0.1
    - name: Analyze exact-revision JavaScript and TypeScript
      run: njsscan --sarif --output owasp-js.sarif .source
    - name: Record completed njsscan evidence
      run: printf '%s\n' '{"scanner_family":"njsscan","status":"COMPLETED","reason":"Native SARIF retained for the
        exact revision.","scanner_version":"1.0.1"}' > njsscan-status.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: owasp-js
        path: 'owasp-js.sarif

          njsscan-status.json'
        if-no-files-found: error
        retention-days: 7
  community-owasp-iac-secrets:
    name: OWASP IaC secrets (TruffleHog)
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'owasp-iac-secrets') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
    - *id001
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - *id002
    - *id003
    - name: Install verified TruffleHog 3.99.3
      run: 'curl --fail --location --retry 3 https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.3/trufflehog_3.99.3_linux_amd64.tar.gz
        -o trufflehog.tar.gz

        echo ''029b182e0ed35fd5b02cd1eadc2a94bd457ab14ad22a9380b6e5d9652261d28d  trufflehog.tar.gz'' | sha256sum
        --check

        tar -xzf trufflehog.tar.gz trufflehog'
    - name: Analyze exact revision without retaining secret values
      run: 'set -o pipefail

        ./trufflehog filesystem .source --json --no-update 2>/dev/null | python -I scripts/code_analysis/trufflehog_to_sarif.py
        --output owasp-iac-secrets.sarif'
    - name: Record completed redacted TruffleHog evidence
      run: printf '%s\n' '{"scanner_family":"TruffleHog","status":"COMPLETED","reason":"Redacted SARIF retained
        for the exact revision.","scanner_version":"3.99.3"}' > owasp-iac-status.json
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: owasp-iac-secrets
        path: 'owasp-iac-secrets.sarif

          owasp-iac-status.json'
        if-no-files-found: error
        retention-days: 7
  portable-python-bandit:
    name: Portable python-bandit
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-bandit') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install pinned scanner dependencies
      run: python -m pip install -r .ci/requirements.txt
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Run reviewed bandit adapter
      run: python -I scripts/code_analysis/trusted_entry.py portable_runner bandit --source .source --output portable-output/bandit
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: portable-python-bandit
        path: portable-output/
        retention-days: 7
        if-no-files-found: error
  portable-python-ruff:
    name: Portable python-ruff
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'python-ruff') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.tooling_sha }}
        persist-credentials: false
        repository: combustrrr/code-analysis-dashboard
    - name: Load reviewed execution project configuration
      env:
        GH_TOKEN: ${{ github.token }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        TARGET_JSON: ${{ inputs.target }}
        EXPECTED_PROFILE: portable
      run: python -I "$GITHUB_WORKSPACE/./scripts/code_analysis/prepare_project.py"
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install pinned scanner dependencies
      run: python -m pip install -r .ci/requirements.txt
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Run reviewed ruff adapter
      run: python -I scripts/code_analysis/trusted_entry.py portable_runner ruff --source .source --output portable-output/ruff
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: portable-python-ruff
        path: portable-output/
        retention-days: 7
        if-no-files-found: error
  portable-complexity:
    name: Portable complexity
    needs:
    - identity
    if: ${{ contains(fromJSON(needs.identity.outputs.jobs), 'complexity') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
