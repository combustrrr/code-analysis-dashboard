      with:
        python-version: '3.11'
    - name: Install trusted reporting dependencies
      run: python -m pip install click==8.5.0 ruff==0.16.9
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        repository: ${{ fromJSON(inputs.target).source_repository }}
        ref: ${{ fromJSON(inputs.target).head_sha }}
        path: .source
        persist-credentials: false
    - name: Collect exact producer artifacts and assemble report
      env:
        GH_TOKEN: ${{ github.token }}
        TARGET_JSON: ${{ inputs.target }}
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        REQUEST_ID: ${{ inputs.request_id }}
        IS_REUSABLE_ANALYSIS: 'true'
      run: python -m scripts.code_analysis.source_identity --assemble
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: hosted-report-${{ github.run_id }}-${{ github.run_attempt }}
        path: .hosted/report/
        if-no-files-found: error
        retention-days: 7
'on':
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      tooling_sha:
        required: true
        type: string
      request_id:
        required: true
        type: string
    secrets: {}
