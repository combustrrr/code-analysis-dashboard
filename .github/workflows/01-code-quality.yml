name: Code Quality
run-name: "Code Quality \xB7 ${{ inputs.scan_branch || github.head_ref || github.ref_name }} \xB7 ${{ inputs.scan_sha || github.event.pull_request.head.sha\
  \ || github.sha }}"
true:
  workflow_dispatch:
    inputs:
      scan_sha:
        description: Exact branch-head commit selected by the manual orchestrator
        required: false
        type: string
      scan_branch:
        description: Source branch associated with the selected commit
        required: false
        type: string
      ensure_sonar_browse:
        description: Idempotently grant Browse to the SONAR_API_TOKEN user, then verify
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: code-quality-${{ inputs.scan_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  sonarqube-cloud:
    name: SonarQube Cloud (Optional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_API_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      SONAR_PROJECT_KEY: ${{ github.repository_owner }}_${{ github.event.repository.name }}
    steps:
    - name: Checkout exact scan commit
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: Checkout trusted Sonar tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: 'scripts/code_analysis

          sonar-project.properties

          '
        sparse-checkout-cone-mode: false
    - name: Determine whether Sonar analysis is needed
      id: sonar-scope
      env:
        EVENT_NAME: ${{ github.event_name }}
        BEFORE_SHA: ${{ github.event.before }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        SCAN_SHA: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
      shell: bash
      run: "set -euo pipefail\nshould_scan=false\nif [[ \"$EVENT_NAME\" == workflow_dispatch ]]; then\n  should_scan=true\n\
        else\n  base=\"$BEFORE_SHA\"\n  if [[ \"$EVENT_NAME\" == pull_request ]]; then\n    base=\"$BASE_SHA\"\n  fi\n  if\
        \ [[ -z \"$base\" || \"$base\" =~ ^0+$ ]] || ! git cat-file -e \"${base}^{commit}\"; then\n    should_scan=true\n\
        \  elif git diff --name-only \"$base\" \"$SCAN_SHA\" | grep -Eq \\\n    '^(backend/app/|webui/src/|scripts/code_analysis/export_sonar_issues\\\
        .py$|sonar-project\\.properties$|\\.github/workflows/01-code-quality\\.yml$)'; then\n    should_scan=true\n  fi\n\
        fi\nprintf 'should_scan=%s\\n' \"$should_scan\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Probe Sonar credentials without exposing secrets
      if: env.SONAR_TOKEN != '' || env.SONAR_API_TOKEN != ''
      env:
        SCAN_BRANCH: ${{ inputs.scan_branch || github.head_ref || github.ref_name }}
      run: 'python .analysis-tooling/scripts/code_analysis/probe_sonar_access.py

        cat sonar-access-probe.json

        '
    - name: Ensure Browse for the verified Sonar API user
      if: inputs.ensure_sonar_browse == true || (github.event_name == 'push' && contains(github.event.head_commit.message,
        '[ensure-sonar-browse]'))
      env:
        SCAN_BRANCH: ${{ inputs.scan_branch || github.head_ref || github.ref_name }}
      run: 'python .analysis-tooling/scripts/code_analysis/ensure_sonar_browse.py

        cat sonar-browse-grant.json

        '
    - name: Derive stable Sonar analysis branch
      id: sonar-identity
      env:
        SOURCE_BRANCH: ${{ inputs.scan_branch || github.head_ref || github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      shell: bash
      run: "set -euo pipefail\nsonar_branch=\"$SOURCE_BRANCH\"\nif [[ \"$SOURCE_BRANCH\" != \"$DEFAULT_BRANCH\" ]]; then\n\
        \  branch_hash=\"$(printf '%s' \"$SOURCE_BRANCH\" | sha256sum | cut -c1-16)\"\n  sonar_branch=\"branch-issue-wall-$branch_hash\"\
        \nfi\nprintf 'sonar_branch=%s\\n' \"$sonar_branch\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Record unconfigured status
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN == ''
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"SonarQube Cloud","status":"NOT_CONFIGURED","reason":"SONAR_TOKEN
        is unavailable (expected for external fork pull requests)"}'' > sonar-status.json

        '
    - name: Record out-of-scope status
      if: steps.sonar-scope.outputs.should_scan != 'true'
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"SonarQube Cloud","status":"NOT_APPLICABLE","reason":"No
        product source or Sonar configuration changed"}'' > sonar-status.json

        '
    - name: Analyze native push or pull-request event
      id: sonar-native
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != '' && github.event_name != 'workflow_dispatch'
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      with:
        args: -Dproject.settings=.analysis-tooling/sonar-project.properties -Dsonar.organization=${{ github.repository_owner }} -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }} ${{ github.event_name == 'push' && format('-Dsonar.branch.name={0}
          -Dsonar.scm.revision={1}', steps.sonar-identity.outputs.sonar_branch, github.sha) || '' }}
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
    - name: Analyze manually selected branch head
      id: sonar-manual
      if: steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != '' && github.event_name == 'workflow_dispatch'
      continue-on-error: true
      uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
      with:
        args: -Dproject.settings=.analysis-tooling/sonar-project.properties -Dsonar.organization=${{ github.repository_owner }} -Dsonar.projectKey=${{ github.repository_owner }}_${{ github.event.repository.name }} -Dsonar.branch.name=${{ steps.sonar-identity.outputs.sonar_branch
          }} -Dsonar.scm.revision=${{ inputs.scan_sha }}
      env:
        SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
    - name: Export native Sonar issues for Issue Wall
      id: sonar-export
      if: always() && steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_API_TOKEN != '' && (steps.sonar-native.outcome
        == 'success' || steps.sonar-manual.outcome == 'success')
      continue-on-error: true
      env:
        SCAN_BRANCH: ${{ inputs.scan_branch || github.head_ref || github.ref_name }}
        SCAN_SHA: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        PULL_REQUEST: ${{ github.event.pull_request.number }}
        SONAR_BRANCH: ${{ steps.sonar-identity.outputs.sonar_branch }}
      shell: bash
      run: "python .analysis-tooling/scripts/code_analysis/export_sonar_issues.py \\\n  --report-task .scannerwork/report-task.txt\
        \ \\\n  --output sonar-native-issues.json \\\n  --project $SONAR_PROJECT_KEY \\\n  --branch \"$SCAN_BRANCH\"\
        \ \\\n  --sonar-branch \"$SONAR_BRANCH\" \\\n  --commit \"$SCAN_SHA\" \\\n  --pull-request \"$PULL_REQUEST\"\n"
    - name: Record configured scan status
      if: always() && steps.sonar-scope.outputs.should_scan == 'true' && env.SONAR_TOKEN != ''
      env:
        EVENT_NAME: ${{ github.event_name }}
        NATIVE_OUTCOME: ${{ steps.sonar-native.outcome }}
        MANUAL_OUTCOME: ${{ steps.sonar-manual.outcome }}
        EXPORT_OUTCOME: ${{ steps.sonar-export.outcome }}
      shell: bash
      run: "outcome=\"$NATIVE_OUTCOME\"\nif [[ \"$EVENT_NAME\" == workflow_dispatch ]]; then\n  outcome=\"$MANUAL_OUTCOME\"\
        \nfi\nstatus=CONFIGURED_COMPLETE\nreason=\"\"\nif [[ \"$outcome\" != success ]]; then\n  status=CONFIGURED_PARTIAL\n\
        \  reason=\"SonarQube Cloud analysis failed; inspect the scanner log\"\nelif [[ -z \"$SONAR_API_TOKEN\" ]]; then\n\
        \  status=CONFIGURED_PARTIAL\n  reason=\"SONAR_API_TOKEN with project Browse permission is not configured\"\nelif\
        \ [[ \"$EXPORT_OUTCOME\" != success ]]; then\n  status=CONFIGURED_PARTIAL\n  reason=\"SonarQube Cloud analysis completed\
        \ but native issue export failed\"\nfi\njq -n --arg status \"$status\" --arg reason \"$reason\" --arg outcome \"$outcome\"\
        \ --arg export \"$EXPORT_OUTCOME\" \\\n  '{schema_version:\"1\",scanner_family:\"SonarQube Cloud\",status:$status,reason:$reason,surfaces:{analysis:$outcome,native_issue_export:$export}}'\
        \ \\\n  > sonar-status.json\n"
    - name: Upload sonar-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp sonar-status.json\nsonar-access-probe.json\nsonar-browse-grant.json\nsonar-native-issues.json\n.scannerwork/report-task.txt\n\
        \ s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/sonar-results --recursive --endpoint-url\
        \ https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  python-ruff:
    name: Ruff (Python Lint + Format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: '.coderabbit.yaml

          .github/workflows

          .ci

          config/code-analysis/ruff.toml

          config/code-analysis

          deploy

          scripts/code_analysis

          '
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: .analysis-tooling/.ci/requirements.txt
    - name: Install pinned tools
      run: python -m pip install --requirement .analysis-tooling/.ci/requirements.txt
    - name: Enforce code-analysis workflow policy
      run: python .analysis-tooling/scripts/code_analysis/audit_workflows.py
    - name: "Ruff lint (default rules \u2014 matches existing python-static CI gate)"
      run: python -m ruff check backend/app backend/tests --exit-zero
    - name: "Ruff lint (extended rules \u2014 advisory for baseline phase)"
      run: "python -m ruff check backend/ \\\n  --config .analysis-tooling/config/code-analysis/ruff.toml \\\n  --output-format=github\
        \ \\\n  --exit-zero\n"
    - name: Ruff format check (advisory)
      run: "python -m ruff format --check backend/ \\\n  --config .analysis-tooling/config/code-analysis/ruff.toml \\\n  ||\
        \ true\n"
    - name: Ruff lint (JSON for normalizer)
      if: always()
      run: "python -m ruff check backend/ \\\n  --config .analysis-tooling/config/code-analysis/ruff.toml \\\n  --output-format=json\
        \ \\\n  --exit-zero \\\n  --output-file ruff-results.json\n"
    - name: Upload ruff-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp ruff-results.json s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/ruff-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  python-bandit:
    name: Bandit (Python Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: '.ci

          scripts/code_analysis

          '
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: .analysis-tooling/.ci/requirements.txt
    - name: Install tools
      run: python -m pip install --requirement .analysis-tooling/.ci/requirements.txt
    - name: Run Bandit (JSON, advisory for baseline)
      run: "bandit \\\n  -r backend/ \\\n  -c backend/pyproject.toml \\\n  --format json \\\n  --output bandit-results.json\
        \ \\\n  --exit-zero\n"
    - name: Normalize Bandit JSON to SARIF
      run: "mkdir -p bandit-scan-results\ncp bandit-results.json bandit-scan-results/\npython .analysis-tooling/scripts/code_analysis/normalizer.py\
        \ \\\n  --input-dir bandit-scan-results \\\n  --output-dir bandit-normalized\n"
    - name: Report HIGH severity findings (informational)
      if: always()
      run: "python - <<'PY'\nimport json\ndata = json.load(open(\"bandit-results.json\", encoding=\"utf-8\"))\nresults = data.get(\"\
        results\", [])\ncounts = {level: sum(r.get(\"issue_severity\") == level for r in results)\n          for level in\
        \ (\"CRITICAL\", \"HIGH\", \"MEDIUM\", \"LOW\")}\nprint(f\"Bandit findings: {len(results)} total ({counts})\")\nfor\
        \ finding in results:\n    if finding.get(\"issue_severity\") in {\"CRITICAL\", \"HIGH\"}:\n        print(f\"  {finding.get('test_id',\
        \ '')} | {finding.get('filename', '')}:\"\n              f\"{finding.get('line_number', '')} | {finding.get('issue_text',\
        \ '')[:100]}\")\nPY\n"
    - name: Build bounded GitHub Security SARIF view
      run: "python .analysis-tooling/scripts/code_analysis/bound_sarif.py \\\n  --input bandit-normalized/normalized.sarif\
        \ \\\n  --output bandit-normalized/github-security.sarif \\\n  --maximum 5000\n"
    - name: Upload SARIF to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: bandit-normalized/github-security.sarif
        category: bandit
    - name: Upload bandit-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp bandit-results.json\nbandit-normalized/normalized.sarif\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id\
        \ }/${ github.run_attempt }/bandit-results --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  python-types:
    name: Pyright (Python Type Checking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install dependencies + Pyright
      run: 'python -m pip install --upgrade pip

        pip install -r backend/requirements.txt

        pip install -r backend/requirements-dev.txt

        pip install "pyright==1.1.411"

        '
    - name: Run Pyright (advisory)
      run: "pyright backend/app \\\n  --outputjson > pyright-results.json \\\n  || true\n"
    - name: Upload pyright-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp pyright-results.json s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/pyright-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  typescript-quality:
    name: ESLint + tsc (TypeScript/React)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webui
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Set up Node.js 22
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: webui/package-lock.json
    - name: Install locked dependencies
      run: npm ci
    - name: TypeScript type check
      shell: bash
      run: 'set +e

        npx tsc --noEmit --pretty false 2>&1 | tee tsc-results.txt

        exit 0

        '
    - name: ESLint lint (human-readable advisory output)
      run: npx eslint "src/**/*.{ts,tsx}" --format stylish || true
    - name: "ESLint lint (fail on error \u2014 matches existing webui-lint CI gate)"
      continue-on-error: true
      run: npx eslint "src/**/*.{ts,tsx}"
    - name: Upload ESLint results (for normalizer)
      if: always()
      run: 'npx eslint "src/**/*.{ts,tsx}" --format json --output-file eslint-results.json || true

        '
    - name: Upload eslint-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp webui/eslint-results.json s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/eslint-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    - name: Upload tsc-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp webui/tsc-results.txt s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/tsc-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
