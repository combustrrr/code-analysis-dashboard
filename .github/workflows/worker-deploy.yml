name: Deploy code analysis Worker
on:
  pull_request:
    paths: ['analysis-launcher/**', 'scripts/code_analysis/queue_contract.py', '.github/workflows/worker-deploy.yml']
  push:
    branches: [main]
    paths: ['analysis-launcher/**', 'scripts/code_analysis/queue_contract.py', '.github/workflows/worker-deploy.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - run: node --test *.test.mjs
        working-directory: analysis-launcher
      - run: python -m scripts.deployment.validate_deployment
      - run: npx --yes wrangler@4.129.1 deploy --dry-run
        working-directory: analysis-launcher
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Deploy Worker and Durable Object migration
        working-directory: analysis-launcher
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.129.1 deploy
