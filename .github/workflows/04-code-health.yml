name: Code Health & Technical Debt
run-name: "Code Health & Technical Debt \xB7 ${{ inputs.scan_branch || github.head_ref || github.ref_name }} \xB7 ${{ inputs.scan_sha\
  \ || github.event.pull_request.head.sha || github.sha }}"
'on':
  workflow_dispatch:
    inputs:
      scan_sha:
        description: Exact branch-head commit selected by the manual orchestrator
        required: false
        type: string
      scan_branch:
        description: Source branch associated with the selected commit
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: code-health-${{ inputs.scan_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  complexity:
    name: Radon + Xenon (Code Complexity)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: .ci
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: .analysis-tooling/.ci/requirements.txt
    - name: Install tools
      run: python -m pip install --requirement .analysis-tooling/.ci/requirements.txt
    - name: "Radon \u2014 cyclomatic complexity report"
      run: 'echo "=== Cyclomatic Complexity (all functions) ==="

        radon cc backend/ -s -a --min A --json > radon-cc.json

        radon cc backend/ -s -a --min B

        echo "=== Maintainability Index ==="

        radon mi backend/ -s --json > radon-mi.json

        radon mi backend/ -s

        '
    - name: "Xenon \u2014 enforce complexity gate"
      run: "# Fail if any module exceeds:\n# --max-average B  (allow avg up to B)\n# --max-modules B  (allow any module up\
        \ to B)\n# --max-absolute C (hard stop at C \u2014 very complex)\nxenon \\\n  --max-average B \\\n  --max-modules\
        \ B \\\n  --max-absolute C \\\n  backend/ 2>&1 | tee xenon-results.txt || true\n"
    - name: Upload radon-reports to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp radon-cc.json\nradon-mi.json\nxenon-results.txt\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id\
        \ }/${ github.run_attempt }/radon-reports --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  dead-code:
    name: Vulture (Dead Code Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: .ci
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: .analysis-tooling/.ci/requirements.txt
    - name: Install tools
      run: python -m pip install --requirement .analysis-tooling/.ci/requirements.txt
    - name: Run Vulture
      run: "vulture backend/ \\\n  --min-confidence 80 \\\n  > vulture-results.txt || true\n# Print human-readable summary\n\
        vulture backend/ --min-confidence 80 || true\n"
    - name: Upload vulture-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp vulture-results.txt s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/vulture-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  test-coverage:
    name: Coverage.py (Test Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: backend/requirements-dev.txt
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r backend/requirements.txt

        pip install -r backend/requirements-dev.txt

        '
    - name: Run pytest with coverage
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
      run: "cd backend\npython -m coverage erase\nset +e\npython -m coverage run --branch --source=app -m pytest -q\ntest_exit=$?\n\
        python -m coverage json -o coverage.json\npython -m coverage xml -o coverage.xml\npython -m coverage report --show-missing\
        \ --fail-under=70\ncoverage_exit=$?\npython -c 'import json,sys; json.dump({\"schema_version\":\"1\",\"scanner_family\"\
        :\"Coverage.py\",\"status\":\"COMPLETED\",\"reason\":\"Coverage measured; test exit=\"+sys.argv[1]+\", threshold exit=\"\
        +sys.argv[2],\"test_exit_code\":int(sys.argv[1]),\"coverage_exit_code\":int(sys.argv[2])},open(\"coverage-status.json\"\
        ,\"w\"))' \"$test_exit\" \"$coverage_exit\"\nif (( test_exit != 0 || coverage_exit != 0 )); then\n  echo \"::warning::Coverage/test\
        \ thresholds are advisory in Phase 3\"\nfi\nexit 0\n"
    - name: Materialize coverage reports after failed or successful tests
      if: always()
      working-directory: backend
      run: 'python -m coverage json -o coverage.json || true

        python -m coverage xml -o coverage.xml || true

        '
    - name: Upload coverage-reports to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp backend/coverage.xml\nbackend/coverage.json\nbackend/coverage-status.json\n s3://${ secrets.R2_BUCKET_NAME\
        \ }/${ github.run_id }/${ github.run_attempt }/coverage-reports --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID\
        \ }}.r2.cloudflarestorage.com"
