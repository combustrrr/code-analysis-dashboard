name: Analyze all preferred branches
run-name: Analyze all configured preferred branches
on:
  schedule:
    # Keep preferred-branch evidence warm without continuously consuming public runners.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      project_id:
        description: Optional configured project ID; blank queues every project
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: write
concurrency:
  group: preferred-branch-analysis
  cancel-in-progress: false
jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Resolve every preferred branch to an immutable SHA
        id: intents
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_ID: ${{ inputs.project_id }}
        run: echo "path=$(python -m scripts.code_analysis.operator_queue)" >> "$GITHUB_OUTPUT"
      - name: Admit trusted concurrent analyses
        env:
          WORKER_API_TOKEN: ${{ secrets.WORKER_API_TOKEN }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          INTENTS_PATH: ${{ steps.intents.outputs.path }}
          GH_TOKEN: ${{ github.token }}
          EXECUTION_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.[]' "$INTENTS_PATH" | while read -r intent; do
            response=$(curl --fail --silent --show-error --request POST \
              --header "Authorization: Bearer ${WORKER_API_TOKEN}" --header 'Content-Type: application/json' \
              --data "$(jq -cn --argjson request "$intent" '{request:$request}')" \
              "${WORKER_URL}/api/internal/queue/admit")
            echo "$response"
            request_id=$(jq -r '.request_id' <<< "$response")
            source_sha=$(jq -r '.intent.source_sha' <<< "$response")
            gh api --method POST "repos/${EXECUTION_REPOSITORY}/actions/workflows/code-analysis-coordinator.yml/dispatches" \
              -f ref=main -f "inputs[request_id]=${request_id}" -f "inputs[source_sha]=${source_sha}"
          done
