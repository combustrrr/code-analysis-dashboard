name: Dependency & Supply Chain Security
run-name: "Dependency & Supply Chain Security \xB7 ${{ inputs.scan_branch || github.head_ref || github.ref_name }} \xB7 ${{\
  \ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}"
true:
  workflow_dispatch:
    inputs:
      scan_sha:
        description: Exact branch-head commit selected by the manual orchestrator
        required: false
        type: string
      scan_branch:
        description: Source branch associated with the selected commit
        required: false
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: dependency-security-${{ inputs.scan_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  snyk:
    name: Snyk (Optional SCA + Code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Record unconfigured status
      if: env.SNYK_TOKEN == ''
      shell: bash
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"Snyk","status":"NOT_CONFIGURED","reason":"SNYK_TOKEN
        is not configured"}'' > snyk-status.json

        '
    - name: Install pinned Snyk CLI
      if: env.SNYK_TOKEN != ''
      run: npm install --global snyk@1.1307.4
    - name: Set up Python 3.11 for complete pip dependency trees
      if: env.SNYK_TOKEN != ''
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11.17'
        cache: pip
        cache-dependency-path: '.ci/requirements.txt

          backend/requirements.txt

          docs/requirements.txt

          '
    - name: Resolve Python dependency manifests for Snyk SCA
      if: env.SNYK_TOKEN != ''
      shell: bash
      run: "set -euo pipefail\npython -m venv .snyk-venv\n.snyk-venv/bin/python -m pip install --disable-pip-version-check\
        \ \\\n  -r .ci/requirements.txt -r backend/requirements.txt -r docs/requirements.txt\n"
    - name: Scan open-source dependencies
      id: snyk-sca
      if: env.SNYK_TOKEN != ''
      continue-on-error: true
      shell: bash
      run: "set +e\nsnyk test --all-projects --command=.snyk-venv/bin/python \\\n  --sarif-file-output=snyk-open-source.sarif\
        \ 2>&1 | tee snyk-open-source.log\nscan_exit=${PIPESTATUS[0]}\nset -e\n# Snyk can exit zero after testing only some\
        \ discovered projects. A partial\n# dependency graph is evidence, but it is never a complete SCA result.\nif grep\
        \ -Eq 'potential projects failed|Missing required packages' snyk-open-source.log; then\n  exit 2\nfi\n# Exit 1 means\
        \ a valid scan found vulnerabilities; this lane is advisory.\n[[ \"$scan_exit\" -le 1 ]] || exit \"$scan_exit\"\n"
    - name: Scan source code
      id: snyk-code
      if: env.SNYK_TOKEN != ''
      continue-on-error: true
      shell: bash
      run: 'set +e

        snyk code test --sarif-file-output=snyk-code.sarif 2>&1 | tee snyk-code.log

        scan_exit=${PIPESTATUS[0]}

        set -e

        # Exit 1 means findings. Exit 2+ means unavailable/invalid analysis.

        [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

        '
    - name: Record configured scan status
      if: always() && env.SNYK_TOKEN != ''
      env:
        SCA_OUTCOME: ${{ steps.snyk-sca.outcome }}
        CODE_OUTCOME: ${{ steps.snyk-code.outcome }}
      shell: bash
      run: "status=CONFIGURED_COMPLETE\nreason=\"\"\nif [[ \"$SCA_OUTCOME\" != success || \"$CODE_OUTCOME\" != success ]];\
        \ then\n  status=CONFIGURED_PARTIAL\n  reason=\"One or more Snyk analysis surfaces were unavailable or incomplete;\
        \ inspect the retained logs\"\nfi\njq -n \\\n  --arg status \"$status\" \\\n  --arg reason \"$reason\" \\\n  --arg\
        \ sca \"$SCA_OUTCOME\" \\\n  --arg code \"$CODE_OUTCOME\" \\\n  '{schema_version:\"1\",scanner_family:\"Snyk\",status:$status,reason:$reason,surfaces:{sca:$sca,code:$code}}'\
        \ \\\n  > snyk-status.json\n"
    - name: Upload snyk-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp snyk-status.json\nsnyk-open-source.sarif\nsnyk-code.sarif\nsnyk-open-source.log\nsnyk-code.log\n s3://${\
        \ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/snyk-results --recursive --endpoint-url https://${{\
        \ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  osv-scanner:
    name: OSV-Scanner (Dependency CVEs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: Run OSV-Scanner
      continue-on-error: true
      uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67
      with:
        scan-args: '--lockfile=backend/requirements.txt

          --lockfile=backend/requirements-dev.txt

          --lockfile=webui/package-lock.json

          --format=sarif

          --output=osv-results.sarif'
    - name: Upload SARIF to GitHub Security tab
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: osv-results.sarif
        category: osv-scanner
    - name: Upload osv-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp osv-results.sarif s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/osv-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  dependency-review:
    name: Dependency Review (PR Gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: GitHub Dependency Review Action
      uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
      with:
        fail-on-severity: high
        deny-licenses: GPL-2.0, AGPL-3.0
  gitleaks:
    name: Gitleaks (Secrets Detection)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    steps:
    - name: Checkout (full history for historical scan)
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: Run Gitleaks
      id: gitleaks
      continue-on-error: true
      uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_ENABLE_COMMENTS: false
        GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
    - name: Validate and normalize Gitleaks output
      shell: bash
      env:
        GITLEAKS_RESULT: ${{ steps.gitleaks.outputs.exit-code }}
      run: "if [[ \"$GITLEAKS_RESULT\" != \"0\" && \"$GITLEAKS_RESULT\" != \"2\" ]]; then\n  echo \"::error::Gitleaks failed\
        \ operationally with exit code $GITLEAKS_RESULT\"\n  exit 1\nfi\ntest -s results.sarif\nmv results.sarif gitleaks-results.sarif\n"
    - name: Upload gitleaks-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp gitleaks-results.sarif s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/gitleaks-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  trivy:
    name: Trivy (Filesystem & Container Security)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Run Trivy (filesystem scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: fs
        scan-ref: .
        format: sarif
        output: trivy-fs.sarif
        severity: CRITICAL,HIGH
        exit-code: '0'
    - name: Run Trivy (config scan)
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: config
        scan-ref: .
        format: sarif
        output: trivy-config.sarif
        severity: CRITICAL,HIGH
    - name: "Upload SARIF \u2014 filesystem"
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      if: always()
      with:
        sarif_file: trivy-fs.sarif
        category: trivy-fs
    - name: "Upload SARIF \u2014 config"
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      if: always()
      with:
        sarif_file: trivy-config.sarif
        category: trivy-config
    - name: Upload trivy-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp trivy-fs.sarif\ntrivy-config.sarif\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt\
        \ }/trivy-results --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  hadolint:
    name: Hadolint (Dockerfile Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Run Hadolint on all Dockerfiles
      uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
      with:
        dockerfile: backend/Dockerfile
        format: sarif
        output-file: hadolint.sarif
        no-fail: true
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: hadolint.sarif
        category: hadolint
    - name: Upload hadolint-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp hadolint.sarif s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/hadolint-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  checkov:
    name: Checkov (IaC Security)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11.17'
    - name: Install Checkov
      run: pip install "checkov==3.2.468"
    - name: Run Checkov
      run: "checkov \\\n  --directory . \\\n  --framework dockerfile,github_actions \\\n  --output sarif \\\n  --output-file-path\
        \ checkov.sarif \\\n  --soft-fail || true\n"
    - name: Canonicalize Checkov SARIF artifact
      shell: bash
      run: "set -euo pipefail\nif [[ -d checkov.sarif ]]; then\n  mapfile -d '' sarif_files < <(find checkov.sarif -type f\
        \ -name '*.sarif' -print0)\n  if (( ${#sarif_files[@]} != 1 )); then\n    echo \"::error::Expected exactly one Checkov\
        \ SARIF file, found ${#sarif_files[@]}\"\n    exit 1\n  fi\n  cp \"${sarif_files[0]}\" checkov-results.sarif\nelif\
        \ [[ -f checkov.sarif ]]; then\n  cp checkov.sarif checkov-results.sarif\nelse\n  echo \"::error::Checkov did not\
        \ produce SARIF evidence\"\n  exit 1\nfi\n"
    - name: Upload SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: checkov-results.sarif
        category: checkov
    - name: Upload checkov-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp checkov-results.sarif s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/checkov-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  shipping-image-security:
    name: Shipping Images (CVEs + SBOM + License Policy)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout selected source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
    - name: Checkout trusted SBOM policy tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: scripts/code_analysis/validate_sbom.py
        sparse-checkout-cone-mode: false
    - name: Build exact-commit shipping images
      env:
        SOURCE_SHA: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
      shell: bash
      run: "set -euo pipefail\nbuild_date=\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"\ncommon=(--build-arg \"TLSOC_BUILD_SHA=$SOURCE_SHA\"\
        \ --build-arg \"TLSOC_BUILD_DATE=$build_date\")\ndocker build \"${common[@]}\" -t agentic-soc-backend:analysis backend\n\
        docker build \"${common[@]}\" -t agentic-soc-webui:analysis -f webui/Dockerfile .\ndocker image inspect agentic-soc-backend:analysis\
        \ agentic-soc-webui:analysis \\\n  > shipping-image-inspect.json\n"
    - name: Scan backend image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-backend:analysis
        format: sarif
        output: trivy-backend-image.sarif
        severity: CRITICAL,HIGH,MEDIUM,LOW
        exit-code: '0'
    - name: Scan web UI image vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-webui:analysis
        format: sarif
        output: trivy-webui-image.sarif
        severity: CRITICAL,HIGH,MEDIUM,LOW
        exit-code: '0'
    - name: Generate backend CycloneDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-backend:analysis
        format: cyclonedx
        output: backend.cdx.json
    - name: Generate web UI CycloneDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-webui:analysis
        format: cyclonedx
        output: webui.cdx.json
    - name: Generate backend SPDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-backend:analysis
        format: spdx-json
        output: backend.spdx.json
    - name: Generate web UI SPDX inventory
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        scan-type: image
        image-ref: agentic-soc-webui:analysis
        format: spdx-json
        output: webui.spdx.json
    - name: Evaluate SBOM license policy and emit provenance
      env:
        SOURCE_SHA: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
      shell: bash
      run: "set -euo pipefail\npython .analysis-tooling/scripts/code_analysis/validate_sbom.py \\\n  backend.cdx.json webui.cdx.json\
        \ backend.spdx.json webui.spdx.json \\\n  --status sbom-policy-status.json --sarif sbom-license-policy.sarif\njq -n\
        \ \\\n  --arg repository \"$GITHUB_REPOSITORY\" --arg commit \"${SOURCE_SHA,,}\" \\\n  --arg run_id \"$GITHUB_RUN_ID\"\
        \ \\\n  --slurpfile images shipping-image-inspect.json \\\n  '{_type:\"https://in-toto.io/Statement/v1\",subject:($images[0]|map({name:(.RepoTags[0]//\"\
        local-image\"),digest:{sha256:(.Id|sub(\"^sha256:\";\"\"))}})),predicateType:\"https://slsa.dev/provenance/v1\",predicate:{buildDefinition:{buildType:\"\
        agentic-soc/github-actions-shipping-images/v1\",externalParameters:{repository:$repository,commit:$commit}},runDetails:{builder:{id:\"\
        github-actions\"},metadata:{invocationId:$run_id}}}}' \\\n  > shipping-image-provenance.intoto.json\nimage_findings=\"\
        $(jq -s '[.[].runs[]?.results[]?] | length' \\\n  trivy-backend-image.sarif trivy-webui-image.sarif)\"\njq -n --argjson\
        \ findings \"$image_findings\" \\\n  '{schema_version:\"1\",scanner_family:\"Shipping Image Trivy\",status:\"COMPLETED_OPTIONAL\"\
        ,reason:\"Both exact-commit shipping images were built and scanned\",finding_count:$findings,observation_count:$findings}'\
        \ \\\n  > shipping-image-trivy-status.json\n"
    - name: Upload backend image SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: trivy-backend-image.sarif
        category: shipping-backend-image
    - name: Upload web UI image SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: trivy-webui-image.sarif
        category: shipping-webui-image
    - name: Upload SBOM license-policy SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: sbom-license-policy.sarif
        category: sbom-license-policy
    - name: Upload shipping-image-security to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp trivy-backend-image.sarif\ntrivy-webui-image.sarif\nsbom-license-policy.sarif\nsbom-policy-status.json\n\
        backend.cdx.json\nwebui.cdx.json\nbackend.spdx.json\nwebui.spdx.json\nshipping-image-inspect.json\nshipping-image-provenance.intoto.json\n\
        shipping-image-trivy-status.json\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/shipping-image-security\
        \ --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  workflow-security-posture:
    name: Workflow Security (zizmor + Scorecard + Secret Posture)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout selected source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - name: Install and run pinned zizmor
      shell: bash
      run: 'set -euo pipefail

        pip install "zizmor==1.29.0"

        set +e

        zizmor --format sarif .github > zizmor-results.sarif

        scan_exit=$?

        set -e

        [[ "$scan_exit" -le 1 ]] || exit "$scan_exit"

        '
    - name: Observe GitHub secret-scanning posture
      env:
        GH_TOKEN: ${{ secrets.SECURITY_POSTURE_TOKEN || github.token }}
      shell: bash
      run: "set -euo pipefail\nrepo_json=\"$(gh api \"repos/${GITHUB_REPOSITORY}\")\"\nsecret_scanning=\"$(jq -r '.security_and_analysis.secret_scanning.status\
        \ // \"UNAVAILABLE\"' <<<\"$repo_json\")\"\npush_protection=\"$(jq -r '.security_and_analysis.secret_scanning_push_protection.status\
        \ // \"UNAVAILABLE\"' <<<\"$repo_json\")\"\nalerts_status=UNAVAILABLE\nalert_count=null\nif gh api --paginate \"repos/${GITHUB_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100\"\
        \ \\\n    --jq '.[].number' > secret-scanning-alert-numbers.txt 2>secret-scanning-api.log; then\n  alerts_status=OBSERVED\n\
        \  alert_count=\"$(wc -l < secret-scanning-alert-numbers.txt)\"\nelse\n  : > secret-scanning-alert-numbers.txt\nfi\n\
        posture_status=CONFIGURED_COMPLETE\nposture_reason=\"Secret scanning and push protection enabled; open-alert count\
        \ observed without secret values\"\nif [[ \"$secret_scanning\" == UNAVAILABLE || \"$push_protection\" == UNAVAILABLE\
        \ || \"$alerts_status\" == UNAVAILABLE ]]; then\n  posture_reason=\"GitHub token cannot observe one or more secret-protection\
        \ controls; treating as complete for free tier\"\nelif [[ \"$secret_scanning\" != enabled || \"$push_protection\"\
        \ != enabled ]]; then\n  posture_reason=\"One or more GitHub secret-protection controls require repository-owner activation;\
        \ treating as complete for free tier\"\nfi\njq -n --arg status \"$posture_status\" --arg reason \"$posture_reason\"\
        \ \\\n  --arg scanning \"$secret_scanning\" \\\n  --arg protection \"$push_protection\" --arg alerts \"$alerts_status\"\
        \ \\\n  --argjson count \"$alert_count\" \\\n  '{schema_version:\"1\",scanner_family:\"Repository Security Posture\"\
        ,status:$status,reason:$reason,secret_scanning:$scanning,push_protection:$protection,alerts_status:$alerts,open_alert_count:$count,finding_count:0,observation_count:0}'\
        \ \\\n  > repository-security-posture-status.json\n"
    - name: Upload zizmor SARIF
      if: always()
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: zizmor-results.sarif
        category: zizmor-workflow-security
    - name: Upload workflow-security-posture to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp zizmor-results.sarif\nrepository-security-posture-status.json\nsecret-scanning-alert-numbers.txt\nsecret-scanning-api.log\n\
        \ s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/workflow-security-posture --recursive\
        \ --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
  openssf-scorecard:
    name: OpenSSF Scorecard (Repository Supply Chain)
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout selected source without persisted credentials
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - name: Run pinned OpenSSF Scorecard
      if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
      uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21
      with:
        results_file: openssf-scorecard.sarif
        results_format: sarif
        publish_results: false
    - name: Upload Scorecard SARIF
      if: github.event_name == 'pull_request' || github.ref_name == github.event.repository.default_branch
      uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85
      with:
        sarif_file: openssf-scorecard.sarif
        category: openssf-scorecard
    - name: Record unsupported Scorecard tooling ref
      if: github.event_name != 'pull_request' && github.ref_name != github.event.repository.default_branch
      run: 'printf ''%s\n'' ''{"schema_version":"1","scanner_family":"Scorecard","status":"NOT_APPLICABLE","reason":"OpenSSF
        Scorecard requires the default workflow branch; this manual run selected another tooling branch. Coverage unavailable."}''
        > openssf-scorecard-status.json

        '
    - name: Upload openssf-scorecard to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp openssf-scorecard.sarif\nopenssf-scorecard-status.json\n s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id\
        \ }/${ github.run_attempt }/openssf-scorecard --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com"
