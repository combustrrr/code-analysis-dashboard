name: Code Analysis Dashboard
run-name: "Dashboard \xB7 ${{ inputs.scan_branch }} \xB7 ${{ inputs.scan_sha }}"
'on':
  workflow_call:
    inputs:
      scan_branch:
        description: Branch identity for the manually selected source commit
        required: true
        type: string
      scan_sha:
        description: Exact source commit selected by Full Code Analysis (Manual)
        required: true
        type: string
    outputs:
      artifact_url:
        description: Authenticated download page for the complete offline Issue Wall artifact
        value: ${{ jobs.aggregate.outputs.artifact_url }}
      artifact_id:
        description: GitHub artifact identifier for audit and recovery
        value: ${{ jobs.aggregate.outputs.artifact_id }}
      artifact_digest:
        description: SHA-256 digest reported by GitHub for the uploaded artifact
        value: ${{ jobs.aggregate.outputs.artifact_digest }}
permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read
concurrency:
  group: issue-wall-${{ inputs.scan_branch }}
  cancel-in-progress: true
jobs:
  aggregate:
    name: Build one advisory findings dashboard
    outputs:
      artifact_url: ${{ steps.analysis-artifact.outputs.artifact-url }}
      artifact_id: ${{ steps.analysis-artifact.outputs.artifact-id }}
      artifact_digest: ${{ steps.analysis-artifact.outputs.artifact-digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: Checkout this fork branch
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install pinned service dependencies
      run: python -m pip install "click==8.5.0" "ruff==0.16.9"
    - name: Download latest completed scanner artifacts for this branch
      env:
        GH_TOKEN: ${{ github.token }}
        SCAN_BRANCH: ${{ inputs.scan_branch }}
        SCAN_SHA: ${{ inputs.scan_sha }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p scan-artifacts\n: > scanner-run-ids.txt\nworkflows=(01-code-quality.yml 02-security-sast.yml\
        \ 03-dependency-security.yml 04-code-health.yml)\ndeclare -A run_ids=()\nfor attempt in $(seq 1 40); do\n  : \"$attempt\"\
        \  # One shared deadline keeps the four-workflow handoff bounded.\n  missing=0\n  for workflow in \"${workflows[@]}\"\
        ; do\n    [[ -n \"${run_ids[$workflow]:-}\" ]] && continue\n    run_id=\"\"\n    case \"$workflow\" in\n      01-code-quality.yml)\
        \ run_title=\"Code Quality \xB7 $SCAN_BRANCH \xB7 $SCAN_SHA\" ;;\n      02-security-sast.yml) run_title=\"Security\
        \ / SAST \xB7 $SCAN_BRANCH \xB7 $SCAN_SHA\" ;;\n      03-dependency-security.yml) run_title=\"Dependency & Supply\
        \ Chain Security \xB7 $SCAN_BRANCH \xB7 $SCAN_SHA\" ;;\n      04-code-health.yml) run_title=\"Code Health & Technical\
        \ Debt \xB7 $SCAN_BRANCH \xB7 $SCAN_SHA\" ;;\n      *) echo \"Unknown scanner workflow: $workflow\" >&2; exit 1 ;;\n\
        \    esac\n    # Manual aggregation may reuse any successful exact-title run whose\n    # retained artifacts still\
        \ exist, including native push/PR evidence.\n    runs=\"$(gh run list --workflow \"$workflow\" --status success --limit\
        \ 30 --json databaseId,displayTitle)\"\n    run_id=\"$(jq -r --arg title \"$run_title\" '[.[] | select(.displayTitle\
        \ == $title)] | first | .databaseId // empty' <<<\"$runs\")\"\n    if [[ -n \"$run_id\" ]]; then\n      run_ids[$workflow]=\"\
        $run_id\"\n    else\n      ((missing+=1))\n    fi\n  done\n  (( missing == 0 )) && break\n  sleep 30\ndone\nfor workflow\
        \ in \"${workflows[@]}\"; do\n  run_id=\"${run_ids[$workflow]:-}\"\n  if [[ -z \"$run_id\" ]]; then\n    echo \"::error::No\
        \ completed run found for $workflow at monitored commit $SCAN_SHA\"\n    exit 1\n  fi\n  mkdir -p \"scan-artifacts/$workflow\"\
        \n  gh run download \"$run_id\" --dir \"scan-artifacts/$workflow\"\n  printf '%s\\n' \"$run_id\" >> scanner-run-ids.txt\n\
        done\n"
    - name: Collect optional exact-head CodeRabbit advisories
      env:
        CODERABBIT_GITHUB_TOKEN: ${{ secrets.CODERABBIT_GITHUB_TOKEN }}
        COLLECTOR_SHA: 177e333d2bb696424cdde3b1792fc1e08be10be9
        MONITORED_SHA: ${{ inputs.scan_sha }}
        MONITORED_BRANCH: ${{ inputs.scan_branch }}
      shell: bash
      run: "set -euo pipefail\nmkdir -p scan-artifacts/coderabbit\nif ! python scripts/code_analysis/collect_coderabbit.py\
        \ \\\n  --repository \"$GITHUB_REPOSITORY\" \\\n  --branch \"$MONITORED_BRANCH\" \\\n  --commit \"$MONITORED_SHA\"\
        \ \\\n  --output-dir scan-artifacts/coderabbit\nthen\n  printf '%s\\n' '{\"schema_version\":\"1\",\"scanner_family\"\
        :\"CodeRabbit\",\"status\":\"UNAVAILABLE\",\"reason\":\"GitHub review evidence could not be collected\",\"finding_count\"\
        :0,\"observation_count\":0}' \\\n    > scan-artifacts/coderabbit/coderabbit-status.json\nfi\n"
    - name: Run the shared current-findings pipeline
      env:
        MONITORED_SHA: ${{ inputs.scan_sha }}
        MONITORED_BRANCH: ${{ inputs.scan_branch }}
      shell: bash
      run: "set -euo pipefail\nrun_args=()\nwhile IFS= read -r run_id; do run_args+=(--workflow-run-id \"$run_id\"); done\
        \ < scanner-run-ids.txt\nset +e\npython scripts/code_analysis/pipeline.py \\\n  --artifacts scan-artifacts \\\n  --output\
        \ pipeline-output \\\n  --repository \"$GITHUB_REPOSITORY\" \\\n  --commit \"$MONITORED_SHA\" \\\n  --branch \"$MONITORED_BRANCH\"\
        \ \\\n  \"${run_args[@]}\" \\\n  --manifest config/code-analysis/required-channels.json \\\n  2>&1 | tee pipeline-diagnostic.log\n\
        pipeline_exit=${PIPESTATUS[0]}\nset -e\nif (( pipeline_exit != 0 )); then\n  mkdir -p dashboard\n  {\n    echo \"\
        ## Issue Wall \u2014 Web of Scanners\"\n    echo\n    echo \"A publishable snapshot could not be produced. The previous\
        \ hosted snapshot remains active.\"\n    echo\n    echo \"### Bounded pipeline diagnostic\"\n    echo '```text'\n\
        \    tail -n 30 pipeline-diagnostic.log \\\n      | sed -E 's/(token|secret|password|authorization)([^[:space:]]*)/REDACTED/Ig'\n\
        \    echo '```'\n  } > dashboard/github-summary.md\n  exit \"$pipeline_exit\"\nfi\nmv pipeline-output/normalized normalized\n\
        mv pipeline-output/dashboard dashboard\nmv pipeline-output/channel-status.json channel-status.json\nmv pipeline-output/snapshot-provenance.json\
        \ snapshot-provenance.json\nmv pipeline-output/scanner-evidence-contract.json scanner-evidence-contract.json\nrmdir\
        \ pipeline-output\n"
    - name: Build portable snapshot artifact identity
      id: snapshot-key
      if: always()
      env:
        MONITORED_BRANCH: ${{ inputs.scan_branch }}
        MONITORED_SHA: ${{ inputs.scan_sha }}
      shell: bash
      run: "if [[ ! \"$MONITORED_SHA\" =~ ^[0-9a-fA-F]{40}$ ]]; then\n  echo \"Invalid full source commit SHA: $MONITORED_SHA\"\
        \ >&2\n  exit 1\nfi\nbranch_slug=\"$(printf '%s' \"$MONITORED_BRANCH\" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+|-+$//g'\
        \ | cut -c1-80)\"\n[[ -n \"$branch_slug\" ]] || branch_slug=unknown\nbranch_hash=\"$(printf '%s' \"$MONITORED_BRANCH\"\
        \ | sha256sum | cut -c1-12)\"\nbranch_key=\"${branch_slug}-${branch_hash}\"\necho \"branch-key=$branch_key\" >> \"\
        $GITHUB_OUTPUT\"\necho \"commit-key=${MONITORED_SHA,,}\" >> \"$GITHUB_OUTPUT\"\n"
    - name: Upload current-findings-dashboard-${{ steps.snapshot-key.outputs.branch-key }}-${{ steps.snapshot-key.outputs.commit-key
        }}-${{ github.run_id }} to R2
      if: success()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: "aws s3 cp normalized/\ndashboard/\nchannel-status.json\nsnapshot-provenance.json\nscanner-evidence-contract.json\n\
        \ s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/current-findings-dashboard-${{ steps.snapshot-key.outputs.branch-key\
        \ }}-${{ steps.snapshot-key.outputs.commit-key }}-${{ github.run_id }} --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID\
        \ }}.r2.cloudflarestorage.com"
    - name: Publish one advisory GitHub Check for this commit
      if: always()
      env:
        GH_TOKEN: ${{ github.token }}
        MONITORED_SHA: ${{ inputs.scan_sha }}
        ARTIFACT_URL: ${{ steps.analysis-artifact.outputs.artifact-url }}
        ARTIFACT_ID: ${{ steps.analysis-artifact.outputs.artifact-id }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      shell: bash
      run: "set -euo pipefail\ncheck_name=\"Code Analysis Dashboard\"\ncheck_namespace=\"agentic-soc-current-findings-v1\"\
        \ncheck_key=\"${GITHUB_REPOSITORY}:${MONITORED_SHA}:${check_name}:${check_namespace}\"\nexternal_id=\"$(printf '%s'\
        \ \"$check_key\" | sha256sum | cut -d' ' -f1)\"\ndetails_url=\"${ARTIFACT_URL:-$RUN_URL}\"\nmkdir -p dashboard\nif\
        \ [[ ! -f dashboard/github-summary.md ]]; then\n  printf '## Issue Wall \u2014 Web of Scanners\\n\\nA publishable\
        \ snapshot could not be produced. The previous accepted artifact remains authoritative.\\n' > dashboard/github-summary.md\n\
        fi\n{\n  printf '\\n[Download the complete offline Issue Wall artifact](%s)\\n' \"$ARTIFACT_URL\"\n  printf '\\nAfter\
        \ extraction, open \\140dashboard/index.html\\140; \\140dashboard/START_HERE.md\\140 contains the launch guide.\\\
        n'\n  printf '\\nArtifact ID for validated manual recovery: \\140%s\\140\\n' \"${ARTIFACT_ID:-unavailable}\"\n} >>\
        \ dashboard/github-summary.md\nexisting=\"$(gh api \"repos/${GITHUB_REPOSITORY}/commits/${MONITORED_SHA}/check-runs?filter=latest&per_page=100\"\
        )\"\n# The dollar-prefixed names below are jq variables supplied with --arg.\n# shellcheck disable=SC2016\ncheck_id=\"\
        $(jq -r --arg name \"$check_name\" --arg external \"$external_id\" \\\n  '[.check_runs[] | select(.name == $name and\
        \ .external_id == $external)] | first | .id // empty' <<<\"$existing\")\"\nconclusion=\"failure\"\nif [[ -f normalized/current-snapshot.json\
        \ ]] && [[ \"$(jq -r .publishable normalized/current-snapshot.json)\" == \"true\" ]]; then\n  finding_count=\"$(jq\
        \ -r '.finding_count // 0' normalized/current-snapshot.json)\"\n  conclusion=\"success\"\n  if (( finding_count >\
        \ 0 )); then conclusion=\"neutral\"; fi\nfi\n# All dollar-prefixed names below are jq variables supplied with --arg.\n\
        # shellcheck disable=SC2016\njq -n \\\n  --arg name \"$check_name\" \\\n  --arg sha \"$MONITORED_SHA\" \\\n  --arg\
        \ external \"$external_id\" \\\n  --arg url \"$details_url\" \\\n  --arg conclusion \"$conclusion\" \\\n  --rawfile\
        \ summary dashboard/github-summary.md \\\n  '{name:$name, head_sha:$sha, external_id:$external, status:\"completed\"\
        , conclusion:$conclusion, details_url:$url, output:{title:\"Current findings snapshot\", summary:$summary}}' \\\n\
        \  > check-run.json\nif [[ -n \"$check_id\" ]]; then\n  gh api --method PATCH \"repos/${GITHUB_REPOSITORY}/check-runs/${check_id}\"\
        \ --input check-run.json >/dev/null\nelse\n  gh api --method POST \"repos/${GITHUB_REPOSITORY}/check-runs\" --input\
        \ check-run.json >/dev/null\nfi\n"
    - name: Publish run summary
      if: always()
      env:
        SUMMARY_BRANCH: ${{ inputs.scan_branch }}
        SUMMARY_SHA: ${{ inputs.scan_sha }}
        SUMMARY_ARTIFACT_URL: ${{ steps.analysis-artifact.outputs.artifact-url }}
        SUMMARY_ARTIFACT_ID: ${{ steps.analysis-artifact.outputs.artifact-id }}
      shell: bash
      run: "set -euo pipefail\n{\n  if [[ -f dashboard/github-summary.md ]]; then\n    cat dashboard/github-summary.md\n \
        \ else\n    echo \"## Issue Wall\"\n    echo\n    echo \"Dashboard generation did not complete. Inspect this run's\
        \ logs.\"\n  fi\n  echo\n  printf '%s\\n' \"- Monitored branch: \\`${SUMMARY_BRANCH}\\`\"\n  printf '%s\\n' \"- Monitored\
        \ commit: \\`${SUMMARY_SHA}\\`\"\n  printf '%s\\n' \"- Complete offline Issue Wall artifact: ${SUMMARY_ARTIFACT_URL:-not\
        \ published}\"\n  printf '%s\\n' \"- Validated artifact ID: ${SUMMARY_ARTIFACT_ID:-not published}\"\n  echo \"- Issue\
        \ writes: \\`disabled\\`\"\n  echo \"- Autofix generation/application: \\`disabled\\`\"\n  echo \"- Merge blocking:\
        \ \\`disabled\\`\"\n  echo \"- Automatic closing: \\`disabled\\`\"\n} >> \"$GITHUB_STEP_SUMMARY\"\n"
