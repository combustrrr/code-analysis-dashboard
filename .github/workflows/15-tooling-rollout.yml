name: Adopt validated scanner tooling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sonar-project.properties', '.ci/**', 'scripts/code_analysis/**', 'config/code-analysis/**', '.github/workflows/reusable-source*.yml', '.github/workflows/0*.yml']
  workflow_run:
    workflows: ['Scanner compatibility']
    types: [completed]
  schedule:
    - cron: '53 4 * * *'
permissions:
  contents: read
concurrency:
  group: validated-tooling-rollout
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r .ci/requirements.txt
      - run: python -m unittest scripts.code_analysis.test_scanner_updates scripts.code_analysis.test_portable_profile scripts.code_analysis.test_projects scripts.code_analysis.test_repository_service scripts.code_analysis.test_tooling_promotion
      - run: python -m scripts.code_analysis.scanner_smoke
      - run: python -m scripts.code_analysis.audit_workflows
  promote:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile protected rollout PR
        env:
          GH_TOKEN: ${{ secrets.SCANNER_UPDATE_TOKEN }}
        run: python -m scripts.code_analysis.promote_tooling
