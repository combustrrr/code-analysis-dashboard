name: Adopt validated scanner tooling
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sonar-project.properties', '.ci/**', 'scripts/code_analysis/**', 'config/code-analysis/**', '.github/workflows/reusable-source*.yml', '.github/workflows/0*.yml']
  schedule:
    - cron: '53 4 * * *'
permissions:
  contents: read
concurrency:
  group: validated-tooling-rollout
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - run: python -m pip install -r .ci/requirements.txt
      - run: python -m unittest scripts.code_analysis.test_scanner_updates scripts.code_analysis.test_portable_profile scripts.code_analysis.test_projects scripts.code_analysis.test_repository_service scripts.code_analysis.test_tooling_promotion
      - run: python -m scripts.code_analysis.scanner_smoke
      - run: python -m scripts.code_analysis.audit_workflows
  promote:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile protected rollout PR
        env:
          GH_TOKEN: ${{ secrets.SCANNER_UPDATE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The first pass creates or inspects the narrowly scoped promotion PR.
          # Keep this one workflow alive for its exact-head compatibility check
          # instead of spawning a second workflow_run reconciliation.
          for attempt in $(seq 1 36); do
            python -m scripts.code_analysis.promote_tooling
            open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
              --json headRefName --jq '[.[] | select(.headRefName | startswith("tooling-rollout/"))] | length')
            if [[ "$open" == 0 ]]; then
              exit 0
            fi
            sleep 10
          done
          echo 'The protected tooling rollout did not become mergeable within six minutes.' >&2
          exit 1
