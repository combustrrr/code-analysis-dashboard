name: Accessibility barrier
description: Report difficulty using the dashboard with a browser or assistive technology
title: "[Accessibility]: "
labels: ["accessibility"]
body:
  - type: textarea
    id: barrier
    attributes:
      label: Barrier encountered
      description: Describe the page, control, and task that was difficult or impossible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected accessible behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, input method, zoom level, and assistive technology.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, detected secret values, and private report data.
          required: true
