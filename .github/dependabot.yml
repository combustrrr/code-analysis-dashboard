version: 2
updates:
  - package-ecosystem: npm
    directory: /analysis-ui
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: "04:47"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 4
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "deps(ui)"
      include: scope
    groups:
      ui-runtime:
        dependency-type: production
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      ui-development:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - "*"
