name: Security / SAST
run-name: "Security / SAST \xB7 ${{ inputs.scan_branch || github.head_ref || github.ref_name }} \xB7 ${{ inputs.scan_sha ||\
  \ github.event.pull_request.head.sha || github.sha }}"
'on':
  workflow_dispatch:
    inputs:
      scan_sha:
        description: Exact branch-head commit selected by the manual orchestrator
        required: false
        type: string
      scan_branch:
        description: Source branch associated with the selected commit
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: security-sast-${{ inputs.scan_branch || github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  codeql:
    name: CodeQL (Semantic SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
        - python
        - javascript-typescript
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 2
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: .github/codeql
        sparse-checkout-cone-mode: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      with:
        languages: ${{ matrix.language }}
        queries: +security-extended,security-and-quality
        config-file: .analysis-tooling/.github/codeql/codeql-config.yml
    - name: "Build (Python \u2014 no explicit build needed)"
      if: matrix.language == 'python'
      run: "echo \"Python \u2014 autobuild skipped, using source\""
    - name: Autobuild (TypeScript/React)
      if: matrix.language == 'javascript-typescript'
      uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      with:
        category: /language:${{ matrix.language }}
        output: codeql-output
        upload: never
        upload-database: false
    - name: Canonicalize CodeQL SARIF artifact
      shell: bash
      env:
        CODEQL_LANGUAGE: ${{ matrix.language }}
      run: "set -euo pipefail\nmapfile -d '' sarif_files < <(find codeql-output -type f -name '*.sarif' -print0)\nif (( ${#sarif_files[@]}\
        \ != 1 )); then\n  echo \"::error::Expected exactly one CodeQL SARIF file, found ${#sarif_files[@]}\"\n  exit 1\n\
        fi\ncp \"${sarif_files[0]}\" \"codeql-${CODEQL_LANGUAGE}.sarif\"\n"
    - name: Upload SARIF to GitHub Security tab
      if: success()
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      with:
        sarif_file: codeql-${{ matrix.language }}.sarif
        category: codeql-${{ matrix.language }}
    - name: Upload codeql-${{ matrix.language }}-sarif to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp codeql-${{ matrix.language }}.sarif s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt
        }/codeql-${{ matrix.language }}-sarif --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  semgrep:
    name: Semgrep (Pattern Analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
    - name: Checkout
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ inputs.scan_sha || github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
    - name: Checkout trusted analysis tooling
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        path: .analysis-tooling
        sparse-checkout: '.github/semgrep-rules

          scripts/code_analysis

          '
        sparse-checkout-cone-mode: false
    - name: Set up Python 3.11
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.11'
    - name: Install Semgrep
      run: pip install semgrep==1.182.1 click==8.5.0 python-dateutil==2.9.0.post0
    - name: Validate custom Semgrep rules
      run: semgrep --validate --config=.analysis-tooling/.github/semgrep-rules/
    - name: Run Semgrep (JSON output)
      run: "semgrep \\\n  --config=p/python \\\n  --config=p/owasp-top-ten \\\n  --config=p/jwt \\\n  --config=p/secrets \\\
        \n  --config=p/fastapi \\\n  --config=.analysis-tooling/.github/semgrep-rules/ \\\n  --json \\\n  --output=semgrep-results.json\
        \ \\\n  --severity=ERROR \\\n  --severity=WARNING \\\n  backend/ webui/src/ || true\n"
    - name: Normalize Semgrep JSON to SARIF
      run: "mkdir -p semgrep-scan-results\ncp semgrep-results.json semgrep-scan-results/\npython .analysis-tooling/scripts/code_analysis/normalizer.py\
        \ \\\n  --input-dir semgrep-scan-results \\\n  --output-dir semgrep-normalized\n"
    - name: Upload SARIF to GitHub Security tab
      if: always()
      continue-on-error: true
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
      with:
        sarif_file: semgrep-normalized/normalized.sarif
        category: semgrep
    - name: Upload semgrep-sarif to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp semgrep-normalized/normalized.sarif s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt
        }/semgrep-sarif --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    - name: Upload semgrep-results to R2
      if: always()
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
        AWS_DEFAULT_REGION: auto
      run: aws s3 cp semgrep-results.json s3://${ secrets.R2_BUCKET_NAME }/${ github.run_id }/${ github.run_attempt }/semgrep-results
        --recursive --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
