# Source checkout must not define vendor identity; reusable-vendor.yml sets it per target.
sonar.projectKey=combustrrr_code-analysis-dashboard
sonar.organization=combustrrr
sonar.projectName=Code Analysis Dashboard
sonar.sourceEncoding=UTF-8
sonar.sources=scripts/code_analysis,analysis-ui/src
sonar.tests=analysis-ui/tests
sonar.python.version=3.11
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.test.inclusions=analysis-ui/tests/**
sonar.scm.provider=git
