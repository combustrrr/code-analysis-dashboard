# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  path_filters:
    - "!output/**"
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/coverage/**"
    - "!Journal.md"
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: false
    # The default covers only the repository default branch. This fork analyzes PRs
    # targeting every maintained branch, so make that scope explicit.
    base_branches:
      - ".*"
    description_keyword: ""
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"
  path_instructions:
    - path: "analysis-launcher/**"
      instructions: |
        Review authentication, authorization, session, token, and privilege-boundary logic
        in the Cloudflare Worker. Never propose or apply a patch automatically; report
        concerns as advisory evidence.
    - path: "scripts/code_analysis/**"
      instructions: |
        Review scanner trust boundaries, immutable source selection, shell safety,
        provenance, incomplete evidence, and credential separation. Treat repository
        AGENTS.md contracts as authoritative.
    - path: ".github/workflows/**"
      instructions: |
        Review read-only source execution, exact SHA/workflow provenance, secret scope,
        bounded storage, and safe shell inputs. Generated workflows must remain generated.
    - path: "analysis-ui/src/**"
      instructions: |
        Review React correctness, unsafe rendering, authorization assumptions, provenance
        display, and accessibility.
  tools:
    github-checks:
      enabled: true
      # Required scanner groups commonly exceed CodeRabbit's 90-second default.
      timeout_ms: 900000
chat:
  auto_reply: false
